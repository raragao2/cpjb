<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cantinho de Pai José da Bahia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:#fafaf9}::-webkit-scrollbar-thumb{background:#e7e5e4;border-radius:4px}
@keyframes spin{to{transform:rotate(360deg)}}.spin{animation:spin 1s linear infinite}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1}}.fi{animation:fi .25s ease forwards}
.sm{transition:all .3s ease}
</style>
</head>
<body class="bg-stone-50 text-stone-800 min-h-screen flex flex-col" style="font-family:'Plus Jakarta Sans',sans-serif">

<div id="notifs" class="fixed top-4 right-4 z-50 flex flex-col gap-2 max-w-sm w-full pointer-events-none"></div>

<!-- LOADING -->
<div id="pg-load" class="fixed inset-0 bg-stone-50 flex flex-col items-center justify-center z-40">
  <svg class="spin w-10 h-10 text-amber-500 mb-3" fill="none" viewBox="0 0 24 24">
    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
  </svg>
  <p class="text-xs text-stone-400">Conectando ao terreiro...</p>
</div>

<!-- LOGIN -->
<div id="pg-login" class="hidden min-h-screen flex items-center justify-center p-4 bg-gradient-to-tr from-stone-100 to-amber-50/30">
  <div class="bg-white p-8 rounded-3xl w-full max-w-md border border-stone-200 shadow-xl text-center">
    <div class="flex justify-center mb-4">
      <svg width="80" height="80" viewBox="0 0 120 120"><circle cx="60" cy="60" r="54" fill="none" stroke="#ca8a04" stroke-width="2"/><circle cx="60" cy="60" r="48" fill="none" stroke="#292524" stroke-width="4"/><line x1="60" y1="28" x2="60" y2="92" stroke="#292524" stroke-width="6" stroke-linecap="round"/><line x1="28" y1="60" x2="92" y2="60" stroke="#292524" stroke-width="6" stroke-linecap="round"/><polygon points="40,36 42,41 47,41 43,44 45,49 40,46 35,49 37,44 33,41 38,41" fill="#ca8a04"/></svg>
    </div>
    <h1 class="text-2xl font-bold tracking-wider text-stone-900 mb-1" style="font-family:Cinzel,serif">Cantinho de Pai José</h1>
    <p class="text-xs text-stone-500 mb-8">Terreiro de Umbanda e Caridade</p>

    <div id="blk-login">
      <form id="frm-login" class="space-y-4 text-left">
        <div>
          <label class="block text-xs font-bold uppercase text-stone-600 mb-1">E-mail</label>
          <input type="email" id="inp-email" required placeholder="seuemail@exemplo.com"
            class="w-full px-4 py-3 bg-stone-50 border border-stone-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-400 text-stone-900">
        </div>
        <div>
          <label class="block text-xs font-bold uppercase text-stone-600 mb-1">Senha</label>
          <input type="password" id="inp-pass" required placeholder="••••••••"
            class="w-full px-4 py-3 bg-stone-50 border border-stone-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-400 text-stone-900">
        </div>
        <button type="submit" id="btn-login"
          class="w-full py-3 bg-amber-500 hover:bg-amber-600 text-stone-950 font-bold rounded-xl uppercase tracking-wider flex justify-center items-center gap-2">
          Entrar na Corrente
        </button>
      </form>
      <button onclick="showForgot()" class="mt-4 w-full text-xs text-amber-700 hover:text-amber-900 font-semibold">
        Esqueci minha senha
      </button>
    </div>

    <div id="blk-forgot" class="hidden text-left">
      <div class="mb-4 p-3 bg-amber-50 border border-amber-200 rounded-xl text-xs text-amber-800">
        Digite seu e-mail para receber o link de redefinição de senha.
      </div>
      <form id="frm-forgot" class="space-y-4">
        <div>
          <label class="block text-xs font-bold uppercase text-stone-600 mb-1">E-mail</label>
          <input type="email" id="inp-frg" required placeholder="seuemail@exemplo.com"
            class="w-full px-4 py-3 bg-stone-50 border border-stone-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-400 text-stone-900">
        </div>
        <button type="submit" class="w-full py-3 bg-stone-900 text-white font-bold rounded-xl uppercase">Enviar Link</button>
      </form>
      <button onclick="showLogin()" class="mt-4 w-full text-xs text-stone-500 hover:text-stone-700 font-semibold">← Voltar</button>
    </div>
  </div>
</div>

<!-- APP -->
<div id="pg-app" class="hidden flex-1 flex flex-col lg:flex-row min-h-screen">
  <aside class="w-full lg:w-64 bg-white flex flex-col border-r border-stone-200 shrink-0">
    <div class="p-5 border-b border-stone-100 flex items-center gap-3">
      <svg width="36" height="36" viewBox="0 0 120 120"><circle cx="60" cy="60" r="54" fill="none" stroke="#ca8a04" stroke-width="2"/><circle cx="60" cy="60" r="48" fill="none" stroke="#292524" stroke-width="4"/><line x1="60" y1="28" x2="60" y2="92" stroke="#292524" stroke-width="6" stroke-linecap="round"/><line x1="28" y1="60" x2="92" y2="60" stroke="#292524" stroke-width="6" stroke-linecap="round"/></svg>
      <div>
        <h2 class="font-bold text-stone-900 text-sm" style="font-family:Cinzel,serif">Pai José da Bahia</h2>
        <p class="text-xs text-stone-500">Terreiro de Umbanda</p>
      </div>
    </div>
    <div class="px-5 py-3 bg-stone-50 border-b border-stone-100 flex items-center justify-between">
      <div>
        <span id="ui-name" class="block font-bold text-sm text-stone-800">—</span>
        <span id="ui-role" class="inline-block px-2 py-0.5 rounded text-[10px] font-bold uppercase bg-amber-500 text-stone-950 mt-1">—</span>
      </div>
      <button onclick="doLogout()" class="p-2 bg-stone-100 hover:bg-red-50 hover:text-red-600 rounded-xl text-stone-500">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7"/></svg>
      </button>
    </div>
    <nav id="nav" class="flex-1 p-3 space-y-1 overflow-y-auto"></nav>
    <div class="p-3 border-t border-stone-100">
      <button onclick="exportBackup()" class="w-full py-2 bg-stone-100 hover:bg-stone-200 text-stone-700 text-xs font-bold rounded-xl uppercase flex items-center justify-center gap-2">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
        Backup JSON
      </button>
    </div>
  </aside>
  <main class="flex-1 flex flex-col min-w-0">
    <div id="content" class="flex-1 p-4 lg:p-8 overflow-y-auto bg-stone-50"></div>
  </main>
</div>

<!-- MODAL -->
<div id="modal-bg" class="fixed inset-0 bg-stone-900/50 backdrop-blur-sm z-50 items-center justify-center p-4 hidden">
  <div class="bg-white rounded-3xl w-full max-w-lg shadow-2xl overflow-hidden border border-stone-200">
    <div class="bg-stone-50 border-b border-stone-200 px-6 py-4 flex justify-between items-center">
      <h3 id="modal-title" class="font-bold text-stone-900" style="font-family:Cinzel,serif">—</h3>
      <button onclick="closeModal()" class="text-stone-400 hover:text-stone-700 text-2xl leading-none">&times;</button>
    </div>
    <div id="modal-body" class="p-6 max-h-[75vh] overflow-y-auto"></div>
  </div>
</div>

<!-- FIREBASE -->
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/11.8.1/firebase-app.js";
import{getAuth,signInWithEmailAndPassword,signOut,sendPasswordResetEmail,updatePassword,EmailAuthProvider,reauthenticateWithCredential,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/11.8.1/firebase-auth.js";
import{getFirestore,doc,getDoc,setDoc,addDoc,updateDoc,deleteDoc,collection,onSnapshot,serverTimestamp,writeBatch,query,orderBy,limit}from"https://www.gstatic.com/firebasejs/11.8.1/firebase-firestore.js";

// ═══════════════════════════════════════════════════════
// COLE SUAS CREDENCIAIS DO FIREBASE AQUI
// ═══════════════════════════════════════════════════════
const cfg={
  apiKey: "AIzaSyAcdTxtNhCXnAD6-CvnMpoe2uKM-njddtA",
  authDomain: "paijose-terreiro.firebaseapp.com",
  databaseURL: "https://paijose-terreiro-default-rtdb.firebaseio.com",
  projectId: "paijose-terreiro",
  storageBucket: "paijose-terreiro.firebasestorage.app",
  messagingSenderId: "810035016716",
  appId: "1:810035016716:web:bf3ddf333b3af0c2166a29"
};

const app=initializeApp(cfg);
const auth=getAuth(app);
const db=getFirestore(app);

window._auth=auth;window._db=db;
window._fns={signInWithEmailAndPassword,signOut,sendPasswordResetEmail,updatePassword,EmailAuthProvider,reauthenticateWithCredential,onAuthStateChanged,doc,getDoc,setDoc,addDoc,updateDoc,deleteDoc,collection,onSnapshot,serverTimestamp,writeBatch,query,orderBy,limit};
window.dispatchEvent(new Event('fb-ok'));
</script>

<script>
// ═══════════════════════════════════════════════════════
// ESTADO
// ═══════════════════════════════════════════════════════
var S={me:null,authUser:null,tab:'dashboard',cfg:{},users:[],stock:[],stockCats:[],freezers:[],foods:[],caixotes:[],fabrics:[],schedule:[],notices:[],presencas:[],logs:[],_uns:[]};

// helpers
function $(id){return document.getElementById(id)}
function pg(id){['load','login','app'].forEach(function(p){$(('pg-'+p)).classList[p===id?'remove':'add']('hidden')});if(id==='app')$('pg-app').classList.remove('hidden')}
function auth(){return window._auth}
function db(){return window._db}
function F(){return window._fns}
function col(n){return F().collection(db(),n)}
function ref(n,id){return F().doc(db(),n,id)}
function ts(){return F().serverTimestamp()}

// ═══════════════════════════════════════════════════════
// NOTIFICAÇÕES
// ═══════════════════════════════════════════════════════
function notif(title,msg,type){
  var c=$('notifs');if(!c)return;
  var id='n'+Date.now();
  var color=type==='error'?'border-red-500/40':type==='success'?'border-amber-400/50':'border-stone-600';
  var el=document.createElement('div');
  el.id=id;el.className='bg-stone-900 border '+color+' text-white p-4 rounded-2xl shadow-xl flex items-start gap-3 pointer-events-auto max-w-sm w-full opacity-0 translate-x-8';
  el.style.transition='all .3s ease';
  el.innerHTML='<div class="flex-1"><p class="font-bold text-sm">'+title+'</p>'+(msg?'<p class="text-xs text-stone-300 mt-1">'+msg+'</p>':'')+'</div><button onclick="document.getElementById(\''+id+'\')?.remove()" class="text-stone-400 hover:text-white text-xl leading-none">&times;</button>';
  c.appendChild(el);
  setTimeout(function(){el.classList.remove('opacity-0','translate-x-8')},20);
  setTimeout(function(){el.classList.add('opacity-0','translate-x-8');setTimeout(function(){el.remove()},300)},5000);
}

// ═══════════════════════════════════════════════════════
// MODAL
// ═══════════════════════════════════════════════════════
function openModal(title,body){
  $('modal-title').innerText=title;
  $('modal-body').innerHTML=body;
  $('modal-bg').style.display='flex';
}
function closeModal(){$('modal-bg').style.display='none';$('modal-body').innerHTML=''}
$('modal-bg').onclick=function(e){if(e.target===$('modal-bg'))closeModal()};

// ═══════════════════════════════════════════════════════
// FIRESTORE HELPERS
// ═══════════════════════════════════════════════════════
async function fsAdd(c,data){return F().addDoc(col(c),Object.assign({},data,{_ts:ts()}))}
async function fsSet(c,id,data){return F().setDoc(ref(c,id),Object.assign({},data,{_ts:ts()}),{merge:true})}
async function fsUpd(c,id,data){return F().updateDoc(ref(c,id),Object.assign({},data,{_ts:ts()}))}
async function fsDel(c,id){return F().deleteDoc(ref(c,id))}
async function addLog(action){if(!S.authUser)return;try{await F().addDoc(col('logs'),{user:S.me?S.me.name:S.authUser.email,cargo:S.me?S.me.cargo:'—',action:action,_ts:ts()})}catch(e){}}

// ═══════════════════════════════════════════════════════
// RBAC
// ═══════════════════════════════════════════════════════
var CARGOS=['ADMIN','PRESIDENTE','SECRETARIA','CAMBONAGEM','COZINHA','TECIDOS','MEDIUM'];
function canRead(u,tab){if(!u)return false;if(u.cargo==='ADMIN')return true;if(u.cargo==='PRESIDENTE'&&tab!=='admin')return true;return(u.allowedTabs||[]).indexOf(tab)>=0}
function canWrite(u,tab){if(!u)return false;if(u.cargo==='ADMIN')return true;if(u.cargo==='PRESIDENTE'&&tab!=='admin')return true;if(u.cargo==='SECRETARIA'&&['secretaria','mediuns','presenca'].indexOf(tab)>=0)return true;var tabs=u.allowedTabs||[];if(u.cargo==='CAMBONAGEM'&&tab==='estoque'&&tabs.indexOf(tab)>=0)return true;if(u.cargo==='COZINHA'&&tab==='cozinha'&&tabs.indexOf(tab)>=0)return true;if(u.cargo==='TECIDOS'&&tab==='tecidos'&&tabs.indexOf(tab)>=0)return true;return false}
function isMgr(u){return['ADMIN','PRESIDENTE'].indexOf(u?u.cargo:'')>=0}

// ═══════════════════════════════════════════════════════
// ABAS
// ═══════════════════════════════════════════════════════
var TABS={
  dashboard:{label:'Início / Dashboard',icon:'M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6'},
  estoque:{label:'Almoxarifado',icon:'M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4'},
  cozinha:{label:'Cozinha & Despensa',icon:'M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253'},
  tecidos:{label:'Tecidos & Caixotes',icon:'M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10'},
  secretaria:{label:'Secretaria / Alertas',icon:'M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z'},
  mediuns:{label:'Corpo de Médiuns',icon:'M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z'},
  presenca:{label:'Lista de Presença',icon:'M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4'},
  hub:{label:'Área do Médium',icon:'M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z'},
  admin:{label:'Administração',icon:'M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z'}
};

function buildNav(){
  var nav=$('nav');nav.innerHTML='';
  Object.keys(TABS).forEach(function(k){
    if(!canRead(S.me,k))return;
    var t=TABS[k];
    var btn=document.createElement('button');
    btn.id='nb-'+k;
    btn.setAttribute('data-tab',k);
    btn.className='w-full flex items-center gap-3 px-4 py-3 rounded-xl font-semibold text-sm text-left text-stone-600 hover:bg-stone-100 sm';
    btn.innerHTML='<svg class="w-5 h-5 shrink-0 text-stone-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="'+t.icon+'"/></svg><span>'+t.label+'</span>';
    btn.onclick=function(){switchTab(this.getAttribute('data-tab'))};
    nav.appendChild(btn);
  });
}

function switchTab(k){
  S.tab=k;
  Object.keys(TABS).forEach(function(t){
    var b=$('nb-'+t);if(!b)return;
    if(t===k){b.className='w-full flex items-center gap-3 px-4 py-3 rounded-xl font-bold text-sm text-left bg-amber-500/10 text-amber-800 border-l-4 border-amber-500 sm';b.querySelector('svg').className='w-5 h-5 shrink-0 text-amber-600'}
    else{b.className='w-full flex items-center gap-3 px-4 py-3 rounded-xl font-semibold text-sm text-left text-stone-600 hover:bg-stone-100 sm';b.querySelector('svg').className='w-5 h-5 shrink-0 text-stone-400'}
  });
  render();
}

function render(){
  var ws=$('content');if(!ws)return;ws.innerHTML='';
  var hw=canWrite(S.me,S.tab);
  var map={dashboard:rDash,estoque:rEstoque,cozinha:rCozinha,tecidos:rTecidos,secretaria:rSec,mediuns:rMediuns,presenca:rPresenca,hub:rHub,admin:rAdmin};
  if(map[S.tab])map[S.tab](ws,hw);
  else ws.innerHTML='<p class="text-stone-400 p-8 text-center">Módulo não encontrado.</p>';
}

// ═══════════════════════════════════════════════════════
// BOOT
// ═══════════════════════════════════════════════════════
window.addEventListener('fb-ok',function(){
  F().onAuthStateChanged(auth(),async function(user){
    if(user){
      S.authUser=user;
      var snap=await F().getDoc(ref('users',user.uid));
      if(snap.exists()){S.me=Object.assign({id:snap.id},snap.data());enterApp()}
      else{await F().signOut(auth());notif('Perfil não encontrado','Contacte o administrador.','error');pg('login')}
    }else{S.me=null;S.authUser=null;S._uns.forEach(function(u){u&&u()});S._uns=[];pg('login')}
  });
});

// ═══════════════════════════════════════════════════════
// LOGIN / LOGOUT / SENHA
// ═══════════════════════════════════════════════════════
$('frm-login').onsubmit=async function(e){
  e.preventDefault();
  var email=$('inp-email').value.trim(),pass=$('inp-pass').value,btn=$('btn-login');
  btn.disabled=true;btn.textContent='Entrando...';
  try{await F().signInWithEmailAndPassword(auth(),email,pass)}
  catch(err){
    var msgs={'auth/user-not-found':'E-mail não cadastrado.','auth/wrong-password':'Senha incorreta.','auth/invalid-credential':'E-mail ou senha incorretos.','auth/invalid-email':'E-mail inválido.','auth/too-many-requests':'Muitas tentativas. Aguarde.'};
    notif('Acesso negado',msgs[err.code]||err.message,'error');
    btn.disabled=false;btn.textContent='Entrar na Corrente';
  }
};

$('frm-forgot').onsubmit=async function(e){
  e.preventDefault();
  try{await F().sendPasswordResetEmail(auth(),$('inp-frg').value.trim());notif('E-mail enviado!','Verifique sua caixa de entrada.','success');showLogin()}
  catch(err){notif('Erro',err.message,'error')}
};

function showForgot(){$('blk-login').classList.add('hidden');$('blk-forgot').classList.remove('hidden')}
function showLogin(){$('blk-forgot').classList.add('hidden');$('blk-login').classList.remove('hidden')}

async function doLogout(){await addLog('Saiu');await F().signOut(auth());notif('Até logo','Que Pai José guie seus passos.','info')}

function openChangePwdModal(){
  openModal('Alterar Minha Senha','<form onsubmit="handleChangePwd(event)" class="space-y-4 text-xs"><div class="p-3 bg-amber-50 border border-amber-200 rounded-xl text-amber-800">Confirme sua senha atual primeiro.</div><div><label class="block font-bold text-stone-500 uppercase mb-1">Senha Atual</label><input type="password" id="pc" required class="w-full p-2.5 bg-stone-50 border border-stone-200 rounded-xl focus:outline-none"></div><div><label class="block font-bold text-stone-500 uppercase mb-1">Nova Senha</label><input type="password" id="pn" required minlength="6" placeholder="Mínimo 6 caracteres" class="w-full p-2.5 bg-stone-50 border border-stone-200 rounded-xl focus:outline-none"></div><div><label class="block font-bold text-stone-500 uppercase mb-1">Confirmar Nova Senha</label><input type="password" id="pf" required class="w-full p-2.5 bg-stone-50 border border-stone-200 rounded-xl focus:outline-none"></div><div class="pt-4 flex justify-end gap-2"><button type="button" onclick="closeModal()" class="px-4 py-2 bg-stone-100 text-stone-600 rounded-xl font-bold">Cancelar</button><button type="submit" class="px-4 py-2 bg-stone-900 text-white rounded-xl font-bold">Alterar</button></div></form>');
}
async function handleChangePwd(e){
  e.preventDefault();
  var cur=$('pc').value,nw=$('pn').value,cf=$('pf').value;
  if(nw!==cf){notif('Erro','As senhas não conferem.','error');return}

function startListeners(){
  S._uns.forEach(function(u){u&&u()});S._uns=[];
  function listen(name,key){
    var u=F().onSnapshot(col(name),function(snap){
      S[key]=snap.docs.map(function(d){return Object.assign({id:d.id},d.data())});
      render();
    },function(err){console.warn(name,err)});
    S._uns.push(u);
  }
  listen('users','users');listen('stock','stock');listen('stockCategories','stockCats');
  listen('freezers','freezers');listen('foods','foods');
  listen('caixotes','caixotes');listen('fabrics','fabrics');
  listen('schedule','schedule');listen('notices','notices');listen('presencas','presencas');
  S._uns.push(F().onSnapshot(ref('config','main'),function(s){if(s.exists())S.cfg=s.data()}));
  if(S.me&&S.me.cargo==='ADMIN'){
    S._uns.push(F().onSnapshot(F().query(col('logs'),F().orderBy('_ts','desc'),F().limit(50)),function(s){S.logs=s.docs.map(function(d){return Object.assign({id:d.id},d.data())})}));

}

old text-stone-500 uppercase mb-2">Minha Frequência</h4><div class="flex gap-3 text-xs"><div class="flex-1 bg-emerald-50 p-2 rounded-xl text-center"><span class="font-bold text-emerald-800 block text-sm">'+myPres+'</span><span class="text-emerald-600 text-[10px]">Presenças</span></div><div class="flex-1 bg-stone-50 p-2 rounded-xl text-center"><span class="font-bold text-stone-800 block text-sm">'+pct+'%</span><span class="text-stone-600 text-[10px]">Frequência</span></div></div></div>':'')+'<p class="text-[10px] text-stone-400 italic text-center mt-4 border-t border-stone-100 pt-3">Consulte a secretaria para atualizar sua ficha.</p></div><div class="lg:col-span-1 space-y-6">'+(ng?'<div class="bg-white p-5 rounded-2xl border border-stone-200 shadow-sm"><span class="text-[10px] bg-amber-500/10 text-amber-800 border border-amber-500/20 font-bold px-2 py-0.5 rounded-lg uppercase">Próxima Gira</span><h4 class="font-bold text-stone-900 mt-2 mb-3" style="font-family:Cinzel,serif">'+ng.line+'</h4><div class="space-y-1.5 text-xs text-stone-600"><p><strong>Data:</strong> '+ng.date+' às '+ng.time+'</p><p><strong>Vestuário:</strong> '+ng.vestuario+'</p><p class="italic bg-stone-50 p-2.5 rounded-lg border border-stone-200 mt-2">"'+(ng.recomendacoes||'')+'"</p></div></div>':'<div class="bg-stone-100 p-6 rounded-2xl border border-dashed text-center text-xs text-stone-400">Sem trabalho escalado.</div>')+'<div class="bg-gradient-to-tr from-stone-900 to-stone-800 text-white p-5 rounded-2xl"><h4 class="font-bold text-xs text-amber-400 uppercase mb-3" style="font-family:Cinzel,serif">📜 Conselho de Pai José</h4><p id="quote-box" class="text-xs font-light leading-relaxed italic text-stone-200 py-4 border-t border-b border-white/10">"'+curQ+'"</p><div class="mt-4 flex justify-end"><button onclick="rotateQ()" class="px-3 py-1.5 bg-white/10 hover:bg-white/20 rounded-lg text-[10px] font-bold uppercase">Novo Conselho</button></div></div></div><div class="lg:col-span-1 bg-white p-5 rounded-2xl border border-stone-200 shadow-sm flex flex-col"><h3 class="font-bold text-sm text-stone-900 border-b border-stone-100 pb-3 mb-4" style="font-family:Cinzel,serif">Minhas Contribuições</h3><div class="flex items-center justify-between p-3 rounded-xl bg-stone-50 border border-stone-200 mb-4 text-xs"><span class="font-bold text-stone-700">Status:</span><span class="px-2 py-0.5 rounded font-bold text-[10px] '+(u.duesStatus==='Em Dia'?'bg-emerald-50 text-emerald-800 border border-emerald-100':'bg-red-50 text-red-800 border border-red-100')+'">'+(u.duesStatus||'—')+'</span></div><div class="mb-4 bg-stone-50 p-4 rounded-xl border border-stone-200"><h4 class="text-[10px] uppercase font-bold text-stone-400 mb-2 border-b border-stone-200 pb-1">Discriminação</h4>'+(dl.length?dl.map(function(d){return'<div class="flex justify-between items-center py-2 border-b border-stone-100 last:border-0 text-xs"><span class="text-stone-600">'+d.item+'</span><span class="font-bold text-stone-800">R$ '+(d.value||0).toFixed(2)+'</span></div>'}).join(''):'<p class="text-xs text-stone-400 text-center py-2">Sem pendências.</p>')+'<div class="flex justify-between border-t border-stone-200 pt-2 mt-2 text-xs"><span class="font-bold text-stone-900">Total</span><span class="font-extrabold text-amber-800 text-sm">R$ '+tot.toFixed(2)+'</span></div></div>'+(S.cfg.pixKey?'<div class="p-4 bg-stone-50 rounded-xl border border-stone-200 text-center"><p class="text-[10px] text-stone-400 font-bold uppercase mb-2">Chave PIX Oficial</p><div class="flex items-center justify-center gap-1.5"><span id="pix-val" class="text-xs font-mono font-bold bg-white px-2.5 py-1 rounded border text-stone-600 select-all">'+S.cfg.pixKey+'</span><button onclick="copyPix()" class="px-2 py-1 bg-stone-200 hover:bg-stone-300 rounded text-[10px] font-bold">Copiar</button></div></div>':'')+(u.duesStatus!=='Em Dia'?'<p class="text-xs text-stone-500 italic text-center mt-3">Pague via PIX e aguarde confirmação.</p>':'<p class="text-[10px] text-emerald-600 font-bold mt-4 text-center">✓ Contribuições em dia!</p>')+'</div></div>';
}
function rotateQ(){curQ=QUOTES[Math.floor(Math.random()*QUOTES.length)];var b=$('quote-box');if(b){b.style.opacity='0';setTimeout(function(){b.innerText='"'+curQ+'"';b.style.opacity='1'},150)}}
function copyPix(){var k=$('pix-val');if(k)navigator.clipboard.writeText(k.innerText).then(function(){notif('PIX Copiado!','','success')})}

// ═══════════════════════════════════════════════════════
// ADMINISTRAÇÃO
// ═══════════════════════════════════════════════════════
function rAdmin(ws){
  var canEdit=isMgr(S.me);
  var rows=S.users.map(function(u){return'<tr class="hover:bg-stone-50 text-xs border-b border-stone-100"><td class="px-4 py-3 font-bold text-stone-800">'+u.name+'</td><td class="px-4 py-3 text-stone-500 text-[10px] max-w-[120px] truncate">'+(u.email||'—')+'</td><td class="px-4 py-3 font-bold text-amber-700 uppercase">'+u.cargo+'</td><td class="px-4 py-3"><span class="px-2 py-0.5 rounded font-bold text-[10px] '+(u.duesStatus==='Em Dia'?'bg-emerald-50 text-emerald-800':'bg-red-50 text-red-800')+'">'+(u.duesStatus||'—')+'</span></td><td class="px-4 py-3 text-right"><div class="flex items-center justify-end gap-2">'+(canEdit?'<button onclick="openPermModal(\''+u.id+'\')" class="px-2 py-1 bg-stone-100 hover:bg-stone-200 text-stone-700 font-bold rounded-lg text-[10px]">Permissões</button><button onclick="openAdminReset(\''+(u.email||'')+'\''+')" class="px-2 py-1 bg-amber-100 hover:bg-amber-200 text-amber-800 font-bold rounded-lg text-[10px]">Reset Senha</button>':'')+'</div></td></tr>'}).join('');
  ws.innerHTML='<div class="mb-6"><h1 class="text-2xl font-bold text-stone-900" style="font-family:Cinzel,serif">Administração</h1><p class="text-xs text-stone-500">Usuários, permissões e configurações</p></div><div class="grid grid-cols-1 lg:grid-cols-3 gap-6"><div class="lg:col-span-1 space-y-6"><div class="bg-white p-5 rounded-2xl border border-stone-200 shadow-sm"><h3 class="font-bold text-sm text-stone-900 border-b border-stone-100 pb-3 mb-4" style="font-family:Cinzel,serif">Identidade do Terreiro</h3><form onsubmit="handleCfg(event)" class="space-y-4 text-xs"><div><label class="block font-bold text-stone-500 uppercase mb-1">Nome Oficial</label><input type="text" id="cfg-n" value="'+(S.cfg.terreiroName||'')+'" required class="w-full p-2.5 bg-stone-50 border border-stone-200 rounded-xl focus:outline-none"></div><div><label class="block font-bold text-stone-500 uppercase mb-1">Subtítulo</label><input type="text" id="cfg-s" value="'+(S.cfg.subtitle||'')+'" required class="w-full p-2.5 bg-stone-50 border border-stone-200 rounded-xl focus:outline-none"></div><div><label class="block font-bold text-stone-500 uppercase mb-1">Chave PIX</label><input type="text" id="cfg-p" value="'+(S.cfg.pixKey||'')+'" class="w-full p-2.5 bg-stone-50 border border-stone-200 rounded-xl focus:outline-none"></div><div><label class="block font-bold text-stone-500 uppercase mb-1">URL da Logo</label><input type="url" id="cfg-l" value="'+(S.cfg.logoUrl||'')+'" class="w-full p-2.5 bg-stone-50 border border-stone-200 rounded-xl focus:outline-none" placeholder="https://..."></div><button type="submit" class="w-full py-2 bg-stone-900 hover:bg-stone-800 text-white font-bold rounded-xl uppercase">Salvar</button></form></div>'+(canEdit?'<div class="bg-white p-5 rounded-2xl border border-stone-200 shadow-sm"><h3 class="font-bold text-sm text-stone-900 border-b border-stone-100 pb-3 mb-3" style="font-family:Cinzel,serif">Cadastrar Médium</h3><p class="text-xs text-stone-500 mb-4 leading-relaxed">Crie o usuário no <a href="https://console.firebase.google.com" target="_blank" class="text-amber-700 font-bold underline">Firebase Console</a> → Authentication → Add user. Depois clique abaixo.</p><button onclick="openCreateProfile()" class="w-full py-2.5 bg-amber-500 hover:bg-amber-600 text-stone-950 font-bold rounded-xl text-xs uppercase">Criar Perfil de Médium</button></div>':'')+'</div><div class="lg:col-span-2 bg-white p-5 rounded-2xl border border-stone-200 shadow-sm"><h3 class="font-bold text-sm text-stone-900 border-b border-stone-100 pb-4 mb-4" style="font-family:Cinzel,serif">Médiuns Cadastrados</h3><div class="overflow-x-auto"><table class="w-full text-left border-collapse"><thead><tr class="bg-stone-50 text-[10px] font-bold uppercase text-stone-400 border-b border-stone-200"><th class="px-4 py-3">Nome</th><th class="px-4 py-3">E-mail</th><th class="px-4 py-3">Cargo</th><th class="px-4 py-3">Status</th><th class="px-4 py-3"></th></tr></thead><tbody>'+rows+'</tbody></table></div></div></div>';
}
async function handleCfg(e){e.preventDefault();await fsSet('config','main',{terreiroName:$('cfg-n').value.trim(),subtitle:$('cfg-s').value.trim(),pixKey:$('cfg-p').value.trim(),logoUrl:$('cfg-l').value.trim()});await addLog('Atualizou configurações');notif('Configurações salvas!','','success')}
function openPermModal(uid){var u=S.users.find(function(x){return x.id===uid});if(!u)return;var checks=Object.keys(TABS).map(function(t){return'<label class="flex items-center gap-2 p-1.5 bg-stone-50 rounded-xl hover:bg-stone-100 cursor-pointer"><input type="checkbox" name="pt" value="'+t+'" '+((u.allowedTabs||[]).indexOf(t)>=0?'checked':'')+' class="w-3.5 h-3.5 accent-amber-600"><span class="text-[10px] font-medium">'+TABS[t].label+'</span></label>'}).join('');openModal('Permissões: '+u.name,'<form onsubmit="handlePerm(event,\''+uid+'\')" class="space-y-4 text-xs"><div><label class="block font-bold text-stone-500 uppercase mb-1">Cargo</label><select id="pm-c" class="w-full p-2.5 bg-stone-50 border border-stone-200 rounded-xl focus:outline-none">'+CARGOS.map(function(c){return'<option'+(u.cargo===c?' selected':'')+'>'+c+'</option>'}).join('')+'</select></div><div><label class="block font-bold text-stone-500 uppercase mb-2">Módulos Liberados</label><div class="grid grid-cols-2 gap-1 max-h-52 overflow-y-auto">'+checks+'</div></div><div class="pt-4 flex justify-end gap-2 border-t border-stone-100"><button type="button" onclick="closeModal()" class="px-4 py-2 bg-stone-100 text-stone-600 rounded-xl font-bold">Cancelar</button><button type="submit" class="px-4 py-2 bg-stone-900 text-white rounded-xl font-bold">Salvar</button></div></form>')}
async function handlePerm(e,uid){e.preventDefault();var cargo=$('pm-c').value;var tabs=[].filter.call(document.getElementsByName('pt'),function(c){return c.checked}).map(function(c){return c.value});await fsUpd('users',uid,{cargo:cargo,allowedTabs:tabs});await addLog('Atualizou permissões');closeModal();notif('Permissões atualizadas!','','success')}
function openAdminReset(email){if(!email){notif('Erro','Médium sem e-mail cadastrado.','error');return}openModal('Resetar Senha','<div class="space-y-4 text-xs"><div class="p-3 bg-amber-50 border border-amber-200 rounded-xl text-amber-800">Um link de redefinição será enviado para <strong>'+email+'</strong>.</div><div class="pt-4 flex justify-end gap-2"><button onclick="closeModal()" class="px-4 py-2 bg-stone-100 text-stone-600 rounded-xl font-bold">Cancelar</button><button onclick="sendReset(\''+email+'\')" class="px-4 py-2 bg-stone-900 text-white rounded-xl font-bold">Enviar Link</button></div></div>')}
async function sendReset(email){try{await F().sendPasswordResetEmail(auth(),email);closeModal();notif('E-mail enviado!','Link enviado para '+email,'success');await addLog('Enviou reset para '+email)}catch(err){notif('Erro',err.message,'error')}}
function openCreateProfile(){var checks=Object.keys(TABS).map(function(t){return'<label class="flex items-center gap-2 p-1.5 bg-stone-50 rounded-xl hover:bg-stone-100 cursor-pointer"><input type="checkbox" name="np" value="'+t+'" class="w-3.5 h-3.5 accent-amber-600"><span class="text-[10px] font-medium">'+TABS[t].label+'</span></label>'}).join('');openModal('Criar Perfil de Médium','<form onsubmit="handleCreateProfile(event)" class="space-y-4 text-xs"><div class="p-3 bg-blue-50 border border-blue-200 rounded-xl text-blue-800 leading-relaxed"><strong>Como fazer:</strong> Acesse o <a href="https://console.firebase.google.com" target="_blank" class="underline font-bold">Firebase Console</a> → Authentication → Add user → crie com e-mail e senha → copie o <strong>UID</strong> gerado e cole abaixo.</div><div class="grid grid-cols-2 gap-3"><div><label class="block font-bold text-stone-500 uppercase mb-1">Nome Completo</label><input type="text" id="np-name" required class="w-full p-2.5 bg-stone-50 border border-stone-200 rounded-xl focus:outline-none"></div><div><label class="block font-bold text-stone-500 uppercase mb-1">UID do Firebase</label><input type="text" id="np-uid" required placeholder="Cole o UID aqui" class="w-full p-2.5 bg-stone-50 border border-stone-200 rounded-xl focus:outline-none"></div></div><div class="grid grid-cols-2 gap-3"><div><label class="block font-bold text-stone-500 uppercase mb-1">E-mail</label><input type="email" id="np-email" required class="w-full p-2.5 bg-stone-50 border border-stone-200 rounded-xl focus:outline-none"></div><div><label class="block font-bold text-stone-500 uppercase mb-1">Cargo</label><select id="np-cargo" class="w-full p-2.5 bg-stone-50 border border-stone-200 rounded-xl focus:outline-none">'+CARGOS.map(function(c){return'<option>'+c+'</option>'}).join('')+'</select></div></div><div><label class="block font-bold text-stone-500 uppercase mb-2">Módulos Liberados</label><div class="grid grid-cols-2 gap-1 max-h-40 overflow-y-auto">'+checks+'</div></div><div class="pt-4 flex justify-end gap-2 border-t border-stone-100"><button type="button" onclick="closeModal()" class="px-4 py-2 bg-stone-100 text-stone-600 rounded-xl font-bold">Cancelar</button><button type="submit" class="px-4 py-2 bg-stone-900 text-white rounded-xl font-bold">Criar Perfil</button></div></form>')}
async function handleCreateProfile(e){e.preventDefault();var uid=$('np-uid').value.trim(),name=$('np-name').value.trim(),email=$('np-email').value.trim(),cargo=$('np-cargo').value;var tabs=[].filter.call(document.getElementsByName('np'),function(c){return c.checked}).map(function(c){return c.value});if(!uid){notif('Erro','Cole o UID do Firebase.','error');return}await fsSet('users',uid,{name:name,email:email,cargo:cargo,allowedTabs:tabs,crown:{},duesStatus:'Em Dia',duesItems:[],birthday:''});await addLog('Criou perfil: '+name);closeModal();notif('Perfil criado!','Médium já pode acessar.','success')}

// BACKUP
// ═══════════════════════════════════════════════════════
function exportBackup(){var data={version:3,exportedAt:new Date().toISOString(),terreiro:S.cfg.terreiroName,users:S.users,stock:S.stock,schedule:S.schedule,notices:S.notices,presencas:S.presencas,foods:S.foods,freezers:S.freezers,caixotes:S.caixotes,fabrics:S.fabrics,config:S.cfg};var blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='backup-paijose-'+new Date().toISOString().split('T')[0]+'.json';a.click();notif('Backup exportado!','','success')}

</script>
