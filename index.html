<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cantinho de Pai José da Bahia</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- HTML5 QR Code Scanner Library para leitura de código de barras/QR Code na Cambonagem -->
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <script>
      tailwind.config = {
        theme: { extend: {
          fontFamily: { cinzel:['Cinzel','serif'], sans:['"Plus Jakarta Sans"','sans-serif'] }
        }}
      }
    </script>
    <style>
      .sm-t{transition:all .3s cubic-bezier(.4,0,.2,1)}
      ::-webkit-scrollbar{width:6px;height:6px}
      ::-webkit-scrollbar-track{background:#fafaf9}
      ::-webkit-scrollbar-thumb{background:#e7e5e4;border-radius:4px}
      ::-webkit-scrollbar-thumb:hover{background:#ca8a04}
      @keyframes spin{to{transform:rotate(360deg)}}
      .spin{animation:spin 1s linear infinite}
      @keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
      .fi{animation:fi .25s ease forwards}
    </style>
</head>
<body class="bg-stone-50 text-stone-800 font-sans min-h-screen flex flex-col antialiased">

<!-- NOTIFICAÇÕES -->
<div id="notifs" class="fixed top-4 right-4 z-50 flex flex-col gap-2 max-w-sm w-full pointer-events-none"></div>

<!-- LOADING -->
<div id="scr-load" class="fixed inset-0 bg-stone-50 flex flex-col items-center justify-center z-40">
  <svg class="spin w-10 h-10 text-amber-500 mb-4" fill="none" viewBox="0 0 24 24">
    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
  </svg>
  <p class="text-xs text-stone-400 font-medium tracking-wide">Conectando ao terreiro...</p>
</div>

<!-- LOGIN -->
<div id="scr-login" class="hidden min-h-screen flex flex-col justify-center items-center p-4 bg-gradient-to-tr from-stone-100 via-stone-50 to-amber-50/30">
  <div class="bg-white p-8 rounded-3xl w-full max-w-md border border-stone-200 shadow-xl text-center" style="box-shadow:0 4px 20px rgba(202,138,4,.08)">
    <div id="logo-login" class="flex justify-center mb-4"></div>
    <h1 id="ttl-login" class="font-cinzel text-2xl font-bold tracking-wider text-stone-900 mb-1">Cantinho de Pai José</h1>
    <p id="sub-login" class="text-xs text-stone-500 font-medium tracking-wide mb-8">Terreiro de Umbanda e Caridade</p>

    <!-- form login -->
    <div id="blk-login">
      <form id="form-login" class="space-y-5 text-left">
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-stone-600 mb-1">E-mail</label>
          <input type="email" id="inp-email" required autocomplete="email" placeholder="seuemail@exemplo.com"
            class="w-full px-4 py-3 bg-stone-50 border border-stone-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-500/50 text-stone-900 placeholder-stone-400 sm-t">
        </div>
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-stone-600 mb-1">Senha</label>
          <input type="password" id="inp-pass" required autocomplete="current-password" placeholder="••••••••"
            class="w-full px-4 py-3 bg-stone-50 border border-stone-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-500/50 text-stone-900 placeholder-stone-400 sm-t">
        </div>
        <button type="submit" id="btn-login"
          class="w-full py-3 bg-amber-500 hover:bg-amber-600 text-stone-950 font-bold rounded-xl tracking-wider uppercase shadow-md sm-t flex justify-center items-center gap-2">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14"/>
          </svg>
          Entrar na Corrente
        </button>
      </form>
      <button onclick="showForgot()" class="mt-5 w-full text-xs text-amber-700 hover:text-amber-900 font-semibold focus:outline-none">
        Esqueci minha senha
      </button>
    </div>

    <!-- form esqueci senha -->
    <div id="blk-forgot" class="hidden text-left">
      <div class="mb-4 p-3 bg-amber-50 border border-amber-200 rounded-xl text-xs text-amber-800 leading-relaxed">
        Digite seu e-mail cadastrado. Você receberá um link para criar uma nova senha.
      </div>
      <form id="form-forgot" class="space-y-4">
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-stone-600 mb-1">E-mail cadastrado</label>
          <input type="email" id="inp-frg" required placeholder="seuemail@exemplo.com"
            class="w-full px-4 py-3 bg-stone-50 border border-stone-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-500/50 text-stone-900 placeholder-stone-400">
        </div>
        <button type="submit" class="w-full py-3 bg-stone-900 hover:bg-stone-800 text-white font-bold rounded-xl uppercase tracking-wider sm-t">
          Enviar Link de Redefinição
        </button>
      </form>
      <button onclick="showLogin()" class="mt-4 w-full text-xs text-stone-500 hover:text-stone-700 font-semibold">
        ← Voltar ao login
      </button>
    </div>
  </div>
</div>

<!-- APP -->
<div id="scr-app" class="hidden flex-1 flex flex-col lg:flex-row min-h-screen">

  <!-- SIDEBAR -->
  <aside class="w-full lg:w-72 bg-white flex flex-col border-r border-stone-200 shrink-0 shadow-sm">
    <div class="p-6 border-b border-stone-100 flex items-center gap-4">
      <div id="logo-sb" class="p-1 rounded-full border border-amber-500/20"></div>
      <div>
        <h2 id="sb-title" class="font-cinzel text-md font-bold text-stone-900 tracking-wide">Pai José</h2>
        <p id="sb-sub" class="text-xs text-stone-500">Terreiro de Umbanda</p>
      </div>
    </div>
    <div class="px-6 py-4 bg-stone-50/50 border-b border-stone-100 flex items-center justify-between">
      <div class="min-w-0 flex-1 pr-2">
        <span id="ui-name" class="block font-bold text-sm text-stone-800 truncate">—</span>
        <span id="ui-role" class="inline-flex items-center px-2 py-0.5 rounded text-[10px] font-bold uppercase tracking-wide bg-amber-500 text-stone-950 mt-1">—</span>
      </div>
      <button onclick="doLogout()" title="Sair"
        class="p-2 bg-stone-100 hover:bg-red-50 hover:text-red-600 rounded-xl text-stone-500 sm-t">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7"/>
        </svg>
      </button>
    </div>
    <nav id="nav" class="flex-1 p-4 space-y-1 overflow-y-auto"></nav>
    <div class="p-4 border-t border-stone-100">

        class="w-full py-2 bg-stone-100 hover:bg-stone-200 text-stone-700 text-xs font-bold rounded-xl uppercase sm-t flex items-center justify-center gap-2">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
        </svg>
        Exportar Backup JSON
      </button>
    </div>
  </aside>

  <!-- CONTEÚDO -->
  <main class="flex-1 flex flex-col min-w-0 bg-stone-50/35">
    <header class="lg:hidden bg-white p-4 border-b border-stone-200 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <div id="logo-mob"></div>
        <span class="font-cinzel font-bold text-stone-900">Pai José</span>
      </div>
      <div class="flex items-center gap-2">
        <span id="mob-role" class="text-[10px] font-bold bg-amber-500 text-stone-950 px-2 py-0.5 rounded uppercase">—</span>
        <button onclick="doLogout()" class="p-1.5 bg-stone-100 rounded-xl">
          <svg class="w-4 h-4 text-stone-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7"/>
          </svg>

      </div>

    <div id="content" class="flex-1 p-4 lg:p-8 overflow-y-auto"></div>
  </main>
</div>

<!-- MODAL GLOBAL -->
<div id="modal-wrap" class="fixed inset-0 bg-stone-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
  <div class="bg-white rounded-3xl w-full max-w-lg shadow-2xl overflow-hidden transform scale-95 transition-transform duration-300 border border-stone-200" id="global-modal-card">
    <div class="bg-stone-50 border-b border-stone-200 px-6 py-4 flex justify-between items-center">
      <h3 id="modal-title" class="font-cinzel text-md font-bold text-stone-900">—</h3>
      <button onclick="closeModal()" class="text-stone-400 hover:text-stone-700 p-1.5 hover:bg-stone-100 rounded-xl">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>
    <div id="modal-body" class="p-6 max-h-[75vh] overflow-y-auto"></div>
  </div>
</div>

<script>
'use strict';

// ══════════════════════════════════════════════════════
// ESTADO GLOBAL
// ══════════════════════════════════════════════════════
const S = {
  me: null, authUser: null, tab: 'dashboard', cfg: {},
  users:[], stock:[], stockCats:[], cambonagem:[], cambonagemCats:[],
  freezers:[], foods:[], caixotes:[], fabrics:[], schedule:[], notices:[], presencas:[],
  transactions:[], logs:[],
  _uns: []
};

// Filtros
let filterMonth = '';
let filterCategory = '';

// Atalhos Firebase
const FB  = () => window._FB;
const db  = () => FB().db;
const au  = () => FB().auth;
const col = n  => __col(n);
const ref = (n, id) => FB().doc(db(), n, id);
const ts  = () => FB().serverTimestamp();

function __col(n) { return FB().collection(db(), n); }

// ══════════════════════════════════════════════════════
// UTILITÁRIOS DOM
// ══════════════════════════════════════════════════════
const $  = id => document.getElementById(id);
function showEl(id)  { const e=$('scr-'+id); if(e){e.classList.remove('hidden');} }
function hideEl(id)  { const e=$('scr-'+id); if(e){e.classList.add('hidden');} }
function showBlk(id) { const e=$(id); if(e){e.classList.remove('hidden');} }
function hideBlk(id) { const e=$(id); if(e){e.classList.add('hidden');} }

// NOTIFICAÇÕES
function notif(title, msg, type) {
  const c = $('notifs'); if (!c) return;
  const id = 'nf'+Date.now();
  const bdr = type==='error'?'border-red-500/40':type==='success'?'border-amber-500/30':'border-stone-700';
  const ico = type==='error'?'text-red-400':'text-amber-500';
  const el  = document.createElement('div');
  el.id = id;
  el.className = `bg-stone-900 border ${bdr} text-white p-4 rounded-2xl shadow-xl flex items-start gap-3 sm-t opacity-0 translate-x-8 pointer-events-auto max-w-sm w-full`;
  el.innerHTML = `<div class="shrink-0 mt-0.5 ${ico}"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg></div><div class="flex-1"><p class="font-bold text-sm text-stone-100">${title}</p>${msg?`<p class="text-xs text-stone-300 mt-1">${msg}</p>`:''}</div><button onclick="document.getElementById('${id}')?.remove()" class="text-stone-400 hover:text-white shrink-0 text-lg leading-none">×</button>`;
  c.appendChild(el);
  setTimeout(()=>{ el.classList.remove('opacity-0','translate-x-8'); }, 20);
  setTimeout(()=>{ el.classList.add('opacity-0','translate-x-8'); setTimeout(()=>el.remove(),300); }, 5000);
}

// MODAL GLOBAL
function openModal(title, body) {
  $('modal-title').innerText = title;
  $('modal-body').innerHTML  = body;
  $('modal-wrap').classList.remove('hidden');
  const card = $('global-modal-card');
  if (card) {
    card.classList.remove('scale-95');
    card.classList.add('scale-100');
  }
}
function closeModal() {
  if (window._qrScannerInstance) {
    try { window._qrScannerInstance.stop().then(() => window._qrScannerInstance.clear()); } catch(_) {}
    window._qrScannerInstance = null;
  }
  const card = $('global-modal-card');
  if (card) {
    card.classList.remove('scale-100');
    card.classList.add('scale-95');
  }
  setTimeout(() => {
    $('modal-wrap').classList.add('hidden');
    $('modal-body').innerHTML = '';
  }, 150);
}
$('modal-wrap').addEventListener('click', e => { if(e.target===e.currentTarget) closeModal(); });

// HELPERS FIRESTORE
async function fsAdd(c, data)     { return FB().addDoc(col(c), {...data, _ts:ts()}); }
async function fsSet(c, id, data) { return FB().setDoc(ref(c,id), {...data, _ts:ts()}, {merge:true}); }
async function fsUpd(c, id, data) { return FB().updateDoc(ref(c,id), {...data, _ts:ts()}); }
async function fsDel(c, id)       { return FB().deleteDoc(ref(c,id)); }

async function addLog(action) {
  if (!S.authUser) return;
  try { await FB().addDoc(col('logs'), {user:S.me?.name||S.authUser.email, cargo:S.me?.cargo||'—', action, _ts:ts()}); } catch(_){}
}

// LOGO LOGIC
function logoSVG(w,h) {
  if (S.cfg?.logoUrl?.trim())
    return `<img src="${S.cfg.logoUrl}" width="${w}" height="${h}" class="object-contain rounded-full border border-amber-500/20 shadow-sm" onerror="this.style.display='none'">`;
  return `<svg width="${w}" height="${h}" viewBox="0 0 120 120"><circle cx="60" cy="60" r="54" fill="none" stroke="#ca8a04" stroke-width="2"/><circle cx="60" cy="60" r="48" fill="none" stroke="#292524" stroke-width="4"/><line x1="60" y1="28" x2="60" y2="92" stroke="#292524" stroke-width="6" stroke-linecap="round"/><line x1="28" y1="60" x2="92" y2="60" stroke="#292524" stroke-width="6" stroke-linecap="round"/><polygon points="40,36 42,41 47,41 43,44 45,49 40,46 35,49 37,44 33,41 38,41" fill="#ca8a04"/><polygon points="80,84 82,89 87,89 83,92 85,97 80,94 75,97 77,92 73,89 78,89" fill="#ca8a04"/></svg>`;
}
function updateLogos() {
  [['logo-login',120],['logo-sb',44],['logo-mob',32]].forEach(([id,s])=>{ const el=$(id); if(el) el.innerHTML=logoSVG(s,s); });
}

// ══════════════════════════════════════════════════════
// RBAC & NAVEGAÇÃO
// ══════════════════════════════════════════════════════
const CARGOS = ['ADMIN','PRESIDENTE','TESOUREIRO','SECRETARIA','CAMBONAGEM','COZINHA','TECIDOS','MEDIUM'];

function canRead(u, tab) {
  if (!u) return false;
  if (u.cargo === 'ADMIN') return true;
  if (u.cargo === 'PRESIDENTE' && tab !== 'admin') return true;
  if (u.cargo === 'TESOUREIRO' && ['financeiro','mediuns','dashboard','hub'].includes(tab)) return true;
  return (u.allowedTabs||[]).includes(tab);
}

function canWrite(u, tab) {
  if (!u) return false;
  if (u.cargo === 'ADMIN') return true;
  if (u.cargo === 'PRESIDENTE' && tab !== 'admin') return true;
  if (u.cargo === 'TESOUREIRO' && ['financeiro','mediuns'].includes(tab)) return true;
  if (u.cargo === 'SECRETARIA' && ['secretaria','mediuns','presenca'].includes(tab)) return true;
  const tabs = u.allowedTabs||[];
  if (u.cargo==='CAMBONAGEM' && ['estoque','cambonagem'].includes(tab) && tabs.includes(tab)) return true;
  if (u.cargo==='COZINHA'    && tab==='cozinha'  && tabs.includes(tab)) return true;
  if (u.cargo==='TECIDOS'    && tab==='tecidos'  && tabs.includes(tab)) return true;
  return false;
}
function isMgr(u) { return ['ADMIN','PRESIDENTE','TESOUREIRO'].includes(u?.cargo); }

const TABS = {
  dashboard:  { label:'Início / Dashboard',   icon:'M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6' },
  financeiro: { label:'Gestão Financeira',    icon:'M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z' },
  estoque:    { label:'Almoxarifado',         icon:'M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4' },
  cambonagem: { label:'Cambonagem & Louças',  icon:'M9 3v2m6-2v2M9 5a2 2 0 00-2 2v12a2 2 0 002 2h6a2 2 0 002-2V7a2 2 0 00-2-2M9 5h6' },
  cozinha:    { label:'Cozinha & Despensa',   icon:'M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253' },
  tecidos:    { label:'Tecidos & Caixotes',   icon:'M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10' },
  secretaria: { label:'Secretaria / Alertas', icon:'M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z' },
  mediuns:    { label:'Corpo de Médiuns',      icon:'M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z' },
  presenca:   { label:'Lista de Presença',     icon:'M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4' },
  hub:        { label:'Área do Médium',       icon:'M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z' },
  admin:      { label:'Administração',         icon:'M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z' }
};

function buildNav() {
  const nav = $('nav'); nav.innerHTML = '';
  Object.keys(TABS).forEach(k => {
    if (!canRead(S.me, k)) return;
    const t = TABS[k];
    const btn = document.createElement('button');
    btn.id = 'nb-'+k; btn.onclick = () => switchTab(k);
    btn.className = 'w-full flex items-center gap-3 px-4 py-3 rounded-xl font-semibold text-sm text-left text-stone-600 hover:bg-stone-100 sm-t group';
    btn.innerHTML = `<svg class="w-5 h-5 shrink-0 text-stone-400 group-hover:text-amber-600 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="${t.icon}"/></svg><span>${t.label}</span>`;
    nav.appendChild(btn);
  });
}

function switchTab(k) {
  S.tab = k;
  Object.keys(TABS).forEach(t => {
    const b = $('nb-'+t); if (!b) return;
    if (t===k) { 
      b.className='w-full flex items-center gap-3 px-4 py-3 rounded-xl font-bold text-sm text-left bg-amber-500/10 text-amber-800 border-l-4 border-amber-500 sm-t'; 
      b.querySelector('svg').setAttribute('class', 'w-5 h-5 shrink-0 text-amber-600'); 
    }
    else { 
      b.className='w-full flex items-center gap-3 px-4 py-3 rounded-xl font-semibold text-sm text-left text-stone-600 hover:bg-stone-100 sm-t group'; 
      b.querySelector('svg').setAttribute('class', 'w-5 h-5 shrink-0 text-stone-400 group-hover:text-amber-600 transition-colors'); 
    }
  });
  render();
}

function render() {
  const ws = $('content'); if (!ws) return; ws.innerHTML = '';
  const hw = canWrite(S.me, S.tab);
  const map = { 
    dashboard: rDash, 
    financeiro: rFinanceiro,
    estoque: rEstoque, 
    cambonagem: rCambonagem, 
    cozinha: rCozinha, 
    tecidos: rTecidos, 
    secretaria: rSec, 
    mediuns: rMediuns, 
    presenca: rPresenca, 
    hub: rHub, 
    admin: rAdmin 
  };
  (map[S.tab] || (w=>{ w.innerHTML='<p class="text-stone-400 p-8 text-center">Em desenvolvimento.</p>'; }))(ws, hw);
}

// ══════════════════════════════════════════════════════
// BOOT
// ══════════════════════════════════════════════════════
window.addEventListener('fb-ready', () => {
  updateLogos();
  FB().onAuthStateChanged(au(), async authUser => {
    if (authUser) {
      S.authUser = authUser;
      try {
        const snap = await FB().getDoc(ref('users', authUser.uid));
        if (snap.exists()) {
          S.me = { id: snap.id, ...snap.data() };
          enterApp();
        } else {
          await FB().signOut(au());
          notif('Perfil não encontrado', 'Contacte o administrador.', 'error');
          goLogin();
        }
      } catch(err) {
        notif('Erro ao carregar perfil', err.message, 'error');
        goLogin();
      }
    } else {
      S.me = null; S.authUser = null;
      S._uns.forEach(u=>u&&u()); S._uns = [];
      goLogin();
    }
  });
});

function goLogin() {
  hideEl('load'); hideEl('app'); showEl('login');
  loadPublicCfg();
}

async function loadPublicCfg() {
  try {
    const s = await FB().getDoc(ref('config','main'));
    if (s.exists()) {
      S.cfg = s.data();
      $('ttl-login').innerText = S.cfg.terreiroName || 'Cantinho de Pai José';
      $('sub-login').innerText = S.cfg.subtitle     || 'Terreiro de Umbanda e Caridade';
      updateLogos();
    }
  } catch(_) {}
}

// LOGIN / LOGOUT
$('form-login').addEventListener('submit', async e => {
  e.preventDefault();
  const email = $('inp-email').value.trim();
  const pass  = $('inp-pass').value;
  const btn   = $('btn-login');
  btn.disabled = true;
  btn.innerHTML = '<svg class="spin w-5 h-5" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg> Entrando...';
  try {
    await FB().signInWithEmailAndPassword(au(), email, pass);
  } catch(err) {
    const msgs = {
      'auth/user-not-found':     'E-mail não cadastrado.',
      'auth/wrong-password':     'Senha incorreta.',
      'auth/invalid-credential': 'E-mail ou senha incorretos.',
      'auth/invalid-email':      'E-mail inválido.',
      'auth/too-many-requests':  'Muitas tentativas. Aguarde alguns minutos.'
    };
    notif('Acesso negado', msgs[err.code] || err.message, 'error');
    btn.disabled = false;
    btn.innerHTML = '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14"/></svg> Entrar na Corrente';
  }
});

$('form-forgot').addEventListener('submit', async e => {
  e.preventDefault();
  const email = $('inp-frg').value.trim();
  try {
    await FB().sendPasswordResetEmail(au(), email);
    notif('E-mail enviado!', 'Verifique sua caixa de entrada.', 'success');
    showLogin();
  } catch(err) {
    notif('Erro', err.code==='auth/user-not-found'?'E-mail não encontrado.':err.message, 'error');
  }
});

function showForgot() { hideBlk('blk-login'); showBlk('blk-forgot'); }
function showLogin()  { hideBlk('blk-forgot'); showBlk('blk-login'); }

async function doLogout() {
  await addLog('Saiu do sistema');
  await FB().signOut(au());
  notif('Até logo', 'Que Pai José guie seus passos.', 'info');
}

function openChangePwdModal() {
  openModal('Alterar Minha Senha', `
    <form onsubmit="handleChangePwd(event)" class="space-y-4 text-xs">
      <div class="p-3 bg-amber-50 border border-amber-200 rounded-xl text-amber-800">Por segurança, confirme sua senha atual primeiro.</div>
      <div><label class="block font-bold text-stone-500 uppercase mb-1">Senha Atual</label><input type="password" id="pc" required class="w-full p-2.5 bg-stone-50 border border-stone-200 rounded-xl focus:outline-none"></div>
      <div><label class="block font-bold text-stone-500 uppercase mb-1">Nova Senha</label><input type="password" id="pn" required minlength="6" placeholder="Mínimo 6 caracteres" class="w-full p-2.5 bg-stone-50 border border-stone-200 rounded-xl focus:outline-none"></div>
      <div><label class="block font-bold text-stone-500 uppercase mb-1">Confirmar Nova Senha</label><input type="password" id="pf" required class="w-full p-2.5 bg-stone-50 border border-stone-200 rounded-xl focus:outline-none"></div>
      <div class="pt-4 flex justify-end gap-2 border-t border-stone-100">
        <button type="button" onclick="closeModal()" class="px-4 py-2 bg-stone-100 text-stone-600 rounded-xl font-bold">Cancelar</button>
        <button type="submit" class="px-4 py-2 bg-stone-900 text-white rounded-xl font-bold">Alterar</button>
      </div>
    </form>`);
}
async function handleChangePwd(e) {
  e.preventDefault();
  const cur=$('pc').value, nw=$('pn').value, cf=$('pf').value;
  if (nw!==cf) { notif('Erro','As senhas não conferem.','error'); return; }
  try {
    const cred = FB().EmailAuthProvider.credential(S.authUser.email, cur);
    await FB().reauthenticateWithCredential(S.authUser, cred);
    await FB().updatePassword(S.authUser, nw);
    await addLog('Alterou a própria senha');
    closeModal(); notif('Senha alterada!','Nova senha ativa com sucesso.','success');
  } catch(err) {
    const msgs={'auth/wrong-password':'Senha atual incorreta.','auth/weak-password':'Senha muito fraca.'};
    notif('Erro', msgs[err.code]||err.message, 'error');
  }
}

async function enterApp() {
  hideEl('load'); hideEl('login'); showEl('app');
  $('ui-name').innerText  = S.me.name  || '—';
  $('ui-role').innerText  = S.me.cargo || '—';
  $('mob-role').innerText = S.me.cargo || '—';
  await loadCfg();
  startListeners();
  buildNav();
  const tabs = S.me.allowedTabs || ['hub'];
  switchTab(tabs.includes('dashboard') ? 'dashboard' : tabs[0]);
  await addLog('Entrou no sistema');
  notif('Saravá, axé!', `Bem-vindo(a), ${S.me.name}!`, 'success');
}

async function loadCfg() {
  try {
    const s = await FB().getDoc(ref('config','main'));
    S.cfg = s.exists() ? s.data() : { terreiroName:'Cantinho de Pai José da Bahia', subtitle:'Terreiro de Umbanda e Caridade', pixKey:'', logoUrl:'' };
    $('sb-title').innerText = S.cfg.terreiroName || 'Pai José';
    $('sb-sub').innerText   = S.cfg.subtitle     || 'Terreiro de Umbanda';
    updateLogos();
  } catch(e){ console.error(e); }
}

// LISTENERS
function startListeners() {
  S._uns.forEach(u=>u&&u()); S._uns=[];
  const listen = (name, key) => {
    const u = FB().onSnapshot(col(name), snap=>{
      S[key] = snap.docs.map(d=>({id:d.id,...d.data()}));
      render();
    }, err=>console.warn(name,err));
    S._uns.push(u);
  };
  listen('users','users'); 
  listen('stock','stock'); listen('stockCategories','stockCats');
  listen('cambonagem','cambonagem'); listen('cambonagemCategories','cambonagemCats');
  listen('freezers','freezers'); listen('foods','foods');
  listen('caixotes','caixotes'); listen('fabrics','fabrics');
  listen('schedule','schedule'); listen('notices','notices'); listen('presencas','presencas');
  listen('transactions','transactions');

  S._uns.push(FB().onSnapshot(ref('config','main'), s=>{
    if(s.exists()){S.cfg=s.data();$('sb-title').innerText=S.cfg.terreiroName||'Pai José';$('sb-sub').innerText=S.cfg.subtitle||'';updateLogos();}
  }));

  if (S.me?.cargo==='ADMIN') {
    S._uns.push(FB().onSnapshot(
      FB().query(col('logs'), FB().orderBy('_ts','desc'), FB().limit(80)),
      s=>{ S.logs=s.docs.map(d=>({id:d.id,...d.data()})); }
    ));
  }
}
</script>

<script>
'use strict';

function card(icon,label,val,cls,sub) {
  return `<div class="bg-white p-5 rounded-2xl shadow-sm border border-stone-200 flex items-center justify-between"><div><span class="block text-xs font-semibold text-stone-400 uppercase tracking-wider">${label}</span><span class="text-xl font-extrabold ${cls||'text-stone-900'} block mt-1">${val}</span>${sub?`<span class="block text-[10px] text-stone-400 mt-0.5">${sub}</span>`:''}</div><div class="p-3 rounded-xl bg-stone-50 border border-stone-100 text-lg">${icon}</div></div>`;
}

// ══════════════════════════════════════════════════════
// DASHBOARD
// ══════════════════════════════════════════════════════
function rDash(ws) {
  const mes   = new Date().getMonth()+1;
  const year  = new Date().getFullYear();
  const curMonthStr = `${year}-${String(mes).padStart(2,'0')}`;

  const crit  = S.stock.filter(i=>i.quantity<=i.minQuantity).length;
  const aniv  = S.users.filter(u=>u.birthday&&parseInt(u.birthday.split('-')[1])===mes)
                .sort((a,b)=>parseInt(a.birthday.split('-')[2])-parseInt(b.birthday.split('-')[2]));
  const ng    = [...S.schedule].sort((a,b)=>(a.date||'').localeCompare(b.date||''))[0];

  let cards = '';
  
  // SE O USUÁRIO TEM PERMISSÃO PARA VER FINANCEIRO:
  if (canRead(S.me, 'financeiro')) {
    const monthTx = S.transactions.filter(t => (t.date || '').startsWith(curMonthStr));
    const totalEntradas = monthTx.filter(t => t.type === 'entrada').reduce((a, b) => a + (b.amount || 0), 0);
    const totalSaidas   = monthTx.filter(t => t.type === 'saida').reduce((a, b) => a + (b.amount || 0), 0);
    const saldo         = totalEntradas - totalSaidas;

    const inadimCount = S.users.filter(u => u.duesStatus === 'Pendente').length;

    cards += card('💰', 'Entradas (Mês)', `R$ ${totalEntradas.toFixed(2)}`, 'text-emerald-700', 'Mensalidades + Doações');
    cards += card('💸', 'Saídas (Mês)', `R$ ${totalSaidas.toFixed(2)}`, 'text-red-600', 'Contas e Despesas da Casa');
    cards += card('⚖️', 'Saldo do Mês', `R$ ${saldo.toFixed(2)}`, saldo >= 0 ? 'text-emerald-800' : 'text-red-700', saldo >= 0 ? 'Balanço positivo' : 'Atenção ao caixa');
    cards += card('📋', 'Mensalidades', `${inadimCount} pendente${inadimCount!==1?'s':''}`, inadimCount > 0 ? 'text-amber-800' : 'text-emerald-700', inadimCount > 0 ? 'Médiuns a quitar' : '100% em dia');
  } else {
    // Para médiuns normais sem financeiro:
    if (canRead(S.me,'estoque')) cards += card('📦','Almoxarifado',`${S.stock.reduce((a,i)=>a+i.quantity,0)} un`, crit>0?'text-red-500':'text-stone-900', crit>0?`${crit} itens em estoque baixo`:'');
    if (canRead(S.me,'cambonagem')) cards += card('🏺','Cambonagem',`${S.cambonagem.reduce((a,i)=>a+(i.quantity||0),0)} un`, 'text-amber-800', `${S.cambonagem.length} utensílios cadastrados`);
    cards += card('👥','Médiuns', `${S.users.length}`, 'text-stone-900');
    cards += card('✨','Próxima Gira', ng?.date||'Nenhuma','text-stone-900', ng?.line||'');
  }

  const giraCard = ng
    ? `<div class="bg-gradient-to-br from-stone-900 to-stone-800 text-white p-6 rounded-2xl border border-amber-500/20 shadow-lg">
         <span class="inline-block bg-amber-500 text-stone-950 text-[10px] font-bold px-2 py-0.5 rounded-lg uppercase mb-3">Próxima Gira</span>
         <h4 class="font-cinzel text-lg font-bold text-amber-400">${ng.line}</h4>
         <div class="mt-3 space-y-2 text-xs">
           <p><strong class="text-stone-300">Data/Hora:</strong> ${ng.date} às ${ng.time}</p>
           <p><strong class="text-stone-300">Dirigente:</strong> ${ng.dirigente}</p>
           <p><strong class="text-stone-300">Vestuário:</strong> ${ng.vestuario}</p>
           <p class="mt-2 text-stone-200 italic border-t border-white/10 pt-2">${ng.recomendacoes||''}</p>
         </div>
       </div>`
    : `<div class="p-6 bg-stone-100 rounded-2xl text-center text-stone-400 text-xs border border-dashed border-stone-200">Nenhuma gira escalada.</div>`;

  const anivHtml = aniv.length
    ? aniv.map(u=>`<div class="flex items-center gap-2 py-1.5 border-b border-stone-100 last:border-0 text-xs"><span class="font-bold text-amber-700 w-6 shrink-0">${u.birthday.split('-')[2]}</span><span class="text-stone-700">${u.name}</span></div>`).join('')
    : `<p class="text-xs text-stone-400 text-center py-2">Sem aniversariantes este mês.</p>`;

  const avisosHtml = S.notices.length
    ? S.notices.slice(0,6).map(n=>{
        const b = n.level==='urgente'?'bg-red-50 text-red-700 border-red-200 animate-pulse':n.level==='festividade'?'bg-amber-50 text-amber-700 border-amber-200':'bg-stone-100 text-stone-700 border-stone-200';
        return `<div class="p-4 rounded-2xl border border-stone-100 bg-white shadow-sm"><div class="flex justify-between items-center mb-2"><span class="px-2 py-0.5 rounded-lg text-[10px] uppercase border font-bold ${b}">${n.level}</span><span class="text-[10px] text-stone-400">${n.date||''}</span></div><h4 class="font-bold text-sm text-stone-900 mb-1">${n.title}</h4><p class="text-xs text-stone-600 leading-relaxed font-light">${n.text}</p></div>`;
      }).join('')
    : `<div class="p-6 bg-white border border-dashed border-stone-200 rounded-2xl text-center text-stone-400 text-xs col-span-full">Sem comunicados ativos.</div>`;

  const logsHtml = S.me.cargo==='ADMIN' && S.logs.length
    ? `<div class="bg-white p-5 rounded-2xl border border-stone-200 shadow-sm">
         <h4 class="font-cinzel text-xs font-bold text-stone-900 mb-3 border-b border-stone-100 pb-2 uppercase">Auditoria Recente</h4>
         ${S.logs.slice(0,8).map(l=>`<div class="flex justify-between items-start py-1.5 border-b border-stone-100 last:border-0 text-xs"><div class="truncate pr-2"><span class="font-bold text-amber-700">${l.user||'?'}</span> <span class="text-stone-600 font-light">${l.action||''}</span></div><span class="text-[10px] text-stone-400 whitespace-nowrap shrink-0">${l._ts?.toDate?l._ts.toDate().toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):''}</span></div>`).join('')}
       </div>`
    : '';

  ws.innerHTML = `
    <div class="mb-6 fi"><h1 class="font-cinzel text-2xl font-bold text-stone-900">Início</h1><p class="text-xs text-stone-500">Bem-vindo(a) ao Cantinho de Pai José da Bahia</p></div>
    <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-8 fi">${cards}</div>
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      <div class="lg:col-span-1 space-y-6">
        ${giraCard}
        <div class="bg-white p-5 rounded-2xl border border-stone-200 shadow-sm">
          <h4 class="font-cinzel text-xs font-bold text-stone-900 mb-3 border-b border-stone-100 pb-2 uppercase">🎂 Aniversariantes do Mês</h4>
          ${anivHtml}
        </div>
        ${logsHtml}
      </div>
      <div class="lg:col-span-2">
        <h3 class="font-cinzel text-sm font-bold text-stone-900 border-b border-stone-200 pb-2 mb-4">Quadro de Avisos</h3>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">${avisosHtml}</div>
      </div>
    </div>`;
}

// ══════════════════════════════════════════════════════
// MÓDULO FINANCEIRO
// ══════════════════════════════════════════════════════
let finSubTab = 'caixa'; // 'caixa' | 'mensalidades' | 'despesas'
let finSearch = '';

function rFinanceiro(ws, hw) {
  const currentMonthStr = new Date().toISOString().substring(0,7);
  if (!filterMonth) filterMonth = currentMonthStr;

  let filteredTx = S.transactions;
  if (filterMonth) {
    filteredTx = filteredTx.filter(t => (t.date || '').startsWith(filterMonth));
  }
  if (filterCategory) {
    filteredTx = filteredTx.filter(t => t.category === filterCategory);
  }
  if (finSearch) {
    filteredTx = filteredTx.filter(t => (t.description||'').toLowerCase().includes(finSearch.toLowerCase()) || (t.user||'').toLowerCase().includes(finSearch.toLowerCase()));
  }

  const totalEntradas = filteredTx.filter(t=>t.type==='entrada').reduce((a,b)=>a+(b.amount||0),0);
  const totalSaidas   = filteredTx.filter(t=>t.type==='saida').reduce((a,b)=>a+(b.amount||0),0);
  const saldoPeriodo  = totalEntradas - totalSaidas;

  // Render sub-abas
  let subContent = '';
  if (finSubTab === 'caixa') {
    const txRows = filteredTx.map(t => {
      const isEntrada = t.type === 'entrada';
      return `<tr class="hover:bg-stone-50/50 text-xs border-b border-stone-100">
        <td class="px-4 py-3 text-stone-500 font-mono">${t.date||'—'}</td>
        <td class="px-4 py-3">
          <span class="inline-flex px-2 py-0.5 rounded-lg text-[10px] font-bold uppercase ${isEntrada?'bg-emerald-50 text-emerald-800 border border-emerald-200':'bg-red-50 text-red-800 border border-red-200'}">
            ${isEntrada ? '↑ Entrada' : '↓ Saída'}
          </span>
        </td>
        <td class="px-4 py-3 font-bold text-stone-800">${t.category||'Geral'}</td>
        <td class="px-4 py-3 text-stone-700">${t.description||'—'}</td>
        <td class="px-4 py-3 font-bold ${isEntrada?'text-emerald-700':'text-red-600'}">
          ${isEntrada?'+':'-'} R$ ${(t.amount||0).toFixed(2)}
        </td>
        <td class="px-4 py-3 text-stone-400 text-[10px]">${t.user||'—'}</td>
        <td class="px-4 py-3 text-right">
          ${hw ? `<button onclick="fsDel('transactions','${t.id}').then(()=>notif('Removido','Lançamento excluído.','warning'))" class="text-xs text-stone-400 hover:text-red-600 p-1">Excluir</button>` : ''}
        </td>
      </tr>`;
    }).join('') || `<tr><td colspan="7" class="py-10 text-center text-stone-400 text-xs">Nenhum lançamento no período selecionado.</td></tr>`;

    subContent = `
      <div class="space-y-4 fi">
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-3">
          <div class="flex flex-wrap gap-2 items-center">
            <label class="text-xs font-bold text-stone-500 uppercase">Mês:</label>
            <input type="month" value="${filterMonth}" onchange="filterMonth=this.value;render()" class="p-2 bg-stone-50 border border-stone-200 rounded-xl text-xs font-bold focus:outline-none">
            
            <label class="text-xs font-bold text-stone-500 uppercase ml-2">Categoria:</label>
            <select onchange="filterCategory=this.value;render()" class="p-2 bg-stone-50 border border-stone-200 rounded-xl text-xs font-bold focus:outline-none">
              <option value="">Todas</option>
              <option ${filterCategory==='Mensalidades'?'selected':''}>Mensalidades</option>
              <option ${filterCategory==='Doações'?'selected':''}>Doações</option>
              <option ${filterCategory==='Aluguel'?'selected':''}>Aluguel</option>
              <option ${filterCategory==='Água/Luz'?'selected':''}>Água/Luz</option>
              <option ${filterCategory==='Cartões'?'selected':''}>Cartões</option>
              <option ${filterCategory==='Manutenção'?'selected':''}>Manutenção</option>
              <option ${filterCategory==='Festividades'?'selected':''}>Festividades</option>
              <option ${filterCategory==='Insumos'?'selected':''}>Insumos</option>
            </select>
          </div>
          <div class="relative w-full md:w-64">
            <input type="text" value="${finSearch}" oninput="finSearch=this.value;render()" placeholder="Buscar lançamento..." class="w-full pl-8 pr-3 py-2 bg-stone-50 border border-stone-200 rounded-xl text-xs focus:outline-none">
            <span class="absolute left-2.5 top-2.5 text-stone-400 text-xs">🔍</span>
          </div>
        </div>

        <div class="overflow-x-auto bg-white rounded-2xl border border-stone-200 shadow-sm">
          <table class="w-full text-left border-collapse">
            <thead>
              <tr class="bg-stone-50 text-[10px] font-bold uppercase tracking-wider text-stone-400 border-b border-stone-200">
                <th class="px-4 py-3">Data</th>
                <th class="px-4 py-3">Tipo</th>
                <th class="px-4 py-3">Categoria</th>
                <th class="px-4 py-3">Descrição / Origem</th>
                <th class="px-4 py-3">Valor</th>
                <th class="px-4 py-3">Registrado por</th>
                <th class="px-4 py-3 text-right">Ação</th>
              </tr>
            </thead>
            <tbody>${txRows}</tbody>
          </table>
        </div>
      </div>`;
  } else if (finSubTab === 'mensalidades') {
    const medCards = S.users.map(m => {

    subContent = `

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">

  } else if (finSubTab === 'despesas') {

        <div>

    subContent = `
      <div class="space-y-4 fi">
        <div class="bg-stone-900 text-white p-5 rounded-2xl border border-stone-800">
          <h4 class="font-cinzel text-sm font-bold text-amber-400 mb-1">Contas Fixas & Custos da Casa</h4>

// LANÇAR TRANSAÇÃO (ENTRADA / SAÍDA)
function openNewTxModal(type = 'entrada') {
  const isEntrada = type === 'entrada';
  openModal(isEntrada ? 'Nova Entrada (Receita)' : 'Nova Saída (Despesa da Casa)', `
    <form onsubmit="handleNewTx(event, '${type}')" class="space-y-4 text-xs">
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block font-bold text-stone-500 uppercase mb-1">Data</label>
          <input type="date" id="tx-date" required value="${new Date().toISOString().substring(0,10)}" class="w-full p-2.5 bg-stone-50 border border-stone-200 rounded-xl focus:outline-none">
        </div>
        <div>
          <label class="block font-bold text-stone-500 uppercase mb-1">Valor (R$)</label>
          <input type="number" step="0.01" min="0.01" id="tx-amount" required placeholder="0.00" class="w-full p-2.5 bg-stone-50 border border-stone-200 rounded-xl focus:outline-none font-bold">
        </div>
      </div>

      <div>
        <label class="block font-bold text-stone-500 uppercase mb-1">Categoria</label>
        <select id="tx-cat" class="w-full p-2.5 bg-stone-50 border border-stone-200 rounded-xl focus:outline-none">
          ${isEntrada ? `
            <option>Mensalidades</option>
            <option>Doações</option>
            <option>Festividades</option>
            <option>Venda de Artigos</option>
            <option>Outras Entradas</option>
          ` : `
            <option>Aluguel</option>
            <option>Água/Luz</option>
            <option>Cartões</option>
            <option>Manutenção</option>
            <option>Insumos</option>
            <option>Alimentação / Cozinha</option>
            <option>Outras Despesas</option>
          `}
        </select>
      </div>

      <div>
        <label class="block font-bold text-stone-500 uppercase mb-1">Descrição / Detalhes</label>
        <input type="text" id="tx-desc" required placeholder="${isEntrada?'Ex: Pagamento mensalidade de Irmão João':'Ex: Fatura de luz mês de Maio'}" class="w-full p-2.5 bg-stone-50 border border-stone-200 rounded-xl focus:outline-none">
      </div>

      <div class="pt-4 flex justify-end gap-2 border-t border-stone-100">
        <button type="button" onclick="closeModal()" class="px-4 py-2 bg-stone-100 text-stone-600 rounded-xl font-bold">Cancelar</button>
        <button type="submit" class="px-4 py-2 ${isEntrada?'bg-emerald-600 hover:bg-emerald-700':'bg-red-600 hover:bg-red-700'} text-white rounded-xl font-bold">${isEntrada?'Salvar Entrada':'Registrar Saída'}</button>
      </div>
    </form>
  `);
}

async function handleNewTx(e, type) {
  e.preventDefault();
  const amount = parseFloat($('tx-amount').value) || 0;
  const date   = $('tx-date').value;
  const category = $('tx-cat').value;
  const description = $('tx-desc').value.trim();

  await fsAdd('transactions', {
    type,
    amount,
    date,
    category,
    description,
    user: S.me?.name || S.authUser.email
  });

  await addLog(`Lançou ${type} financeira: R$ ${amount.toFixed(2)} (${category})`);
  closeModal();
  notif('Transação registrada!', `R$ ${amount.toFixed(2)} cadastrado em ${category}.`, 'success');
}

// LANÇAR COBRANÇA PARA UM MÉDIUM
function openAddDueModal(uid) {
  const u = S.users.find(x => x.id === uid);
  if (!u) return;

  openModal(`Lançar Cobrança para ${u.name}`, `
    <form onsubmit="handleAddDue(event, '${uid}')" class="space-y-4 text-xs">
      <div>
        <label class="block font-bold text-stone-500 uppercase mb-1">Descrição da Cota / Obrigação</label>
        <input type="text" id="due-item" required placeholder="Ex: Mensalidade Maio/2026" class="w-full p-2.5 bg-stone-50 border border-stone-200 rounded-xl focus:outline-none">
      </div>
      <div>
        <label class="block font-bold text-stone-500 uppercase mb-1">Valor (R$)</label>
        <input type="number" step="0.01" min="0.01" id="due-val" value="50.00" required class="w-full p-2.5 bg-stone-50 border border-stone-200 rounded-xl focus:outline-none font-bold">
      </div>
      <div class="pt-4 flex justify-end gap-2 border-t border-stone-100">
        <button type="button" onclick="closeModal()" class="px-4 py-2 bg-stone-100 text-stone-600 rounded-xl font-bold">Cancelar</button>
        <button type="submit" class="px-4 py-2 bg-amber-500 hover:bg-amber-600 text-stone-950 rounded-xl font-bold">Adicionar Cota</button>
      </div>
    </form>
  `);
}

async function handleAddDue(e, uid) {
  e.preventDefault();
  const u = S.users.find(x => x.id === uid);
  if (!u) return;

  const item  = $('due-item').value.trim();
  const value = parseFloat($('due-val').value) || 0;

  const currentItems = u.duesItems || [];
  currentItems.push({ item, value });

  await fsUpd('users', uid, {
    duesItems: currentItems,
    duesStatus: 'Pendente'
  });

  await addLog(`Lançou cota para ${u.name}: ${item} (R$ ${value.toFixed(2)})`);
  closeModal();
  notif('Cota adicionada!', `Lançamento feito para ${u.name}.`, 'success');
}

// LANÇAR COBRANÇA PARA TODOS OS MÉDIUNS
function openBroadcastDueModal() {
  openModal('Lançar Cobrança para TODOS os Médiuns', `
    <form onsubmit="handleBroadcastDue(event)" class="space-y-4 text-xs">
      <div class="p-3 bg-amber-50 border border-amber-200 rounded-xl text-amber-800 leading-relaxed">
        Esta ação adicionará a cota abaixo para <strong>todos os ${S.users.length} médiuns</strong> cadastrados no terreiro.
      </div>
      <div>
        <label class="block font-bold text-stone-500 uppercase mb-1">Descrição do Item</label>
        <input type="text" id="bc-item" required value="Mensalidade do Terreiro" class="w-full p-2.5 bg-stone-50 border border-stone-200 rounded-xl focus:outline-none">
      </div>
      <div>
        <label class="block font-bold text-stone-500 uppercase mb-1">Valor para cada Médium (R$)</label>
        <input type="number" step="0.01" min="0.01" id="bc-val" value="50.00" required class="w-full p-2.5 bg-stone-50 border border-stone-200 rounded-xl focus:outline-none font-bold">
      </div>
      <div class="pt-4 flex justify-end gap-2 border-t border-stone-100">
        <button type="button" onclick="closeModal()" class="px-4 py-2 bg-stone-100 text-stone-600 rounded-xl font-bold">Cancelar</button>
        <button type="submit" class="px-4 py-2 bg-amber-500 hover:bg-amber-600 text-stone-950 rounded-xl font-bold">Lançar para Todos</button>
      </div>
    </form>
  `);
}

async function handleBroadcastDue(e) {
  e.preventDefault();
  const item  = $('bc-item').value.trim();
  const value = parseFloat($('bc-val').value) || 0;

  const batch = FB().writeBatch(db());
  S.users.forEach(u => {
    const curItems = u.duesItems || [];
    curItems.push({ item, value });
    batch.update(FB().doc(db(), 'users', u.id), {
      duesItems: curItems,
      duesStatus: 'Pendente'
    });
  });

  await batch.commit();
  await addLog(`Lançou cobrança coletiva: ${item} (R$ ${value.toFixed(2)})`);
  closeModal();
  notif('Cobrança coletiva enviada!', `Adicionado R$ ${value.toFixed(2)} a todos os médiuns.`, 'success');
}

// REMOVER ITEM INDIVIDUAL DE COBRANÇA
async function removeMediumDue(uid, index) {
  const u = S.users.find(x => x.id === uid);
  if (!u) return;

  const items = u.duesItems || [];
  items.splice(index, 1);
  const newStatus = items.length === 0 ? 'Em Dia' : 'Pendente';

  await fsUpd('users', uid, {
    duesItems: items,
    duesStatus: newStatus
  });

  notif('Item removido', 'Cota do médium atualizada.', 'info');
}

// DAR BAIXA / REGISTRAR PAGAMENTO DO MÉDIUM
async function darBaixaMensalidade(uid) {
  const u = S.users.find(x => x.id === uid);
  if (!u) return;

  const items = u.duesItems || [];
  const totPaid = items.reduce((a,b)=>a+(b.value||0),0);

  if (totPaid > 0) {
    // Registra entrada no caixa automaticamente!
    await fsAdd('transactions', {
      type: 'entrada',
      amount: totPaid,
      date: new Date().toISOString().substring(0,10),
      category: 'Mensalidades',
      description: `Quitado por ${u.name}: ${items.map(i=>i.item).join(', ')}`,
      user: S.me?.name || S.authUser.email,
      mediumId: uid
    });
  }

  // Zera itens do médium e altera status para Em Dia
  await fsUpd('users', uid, {
    duesItems: [],
    duesStatus: 'Em Dia'
  });

  await addLog(`Deu baixa nas mensalidades de ${u.name} (R$ ${totPaid.toFixed(2)})`);
  notif('Baixa efetuada!', `${u.name} está em dia. R$ ${totPaid.toFixed(2)} entrou no Caixa!`, 'success');
}
</script>

<script>
'use strict';

// ══════════════════════════════════════════════════════
// ALMOXARIFADO
// ══════════════════════════════════════════════════════
let stSrch = '';
function rEstoque(ws, hw) {
  const items = stSrch ? S.stock.filter(i=>i.name?.toLowerCase().includes(stSrch.toLowerCase())||i.category?.toLowerCase().includes(stSrch.toLowerCase())) : S.stock;
  const rows = items.length ? items.map(i=>{
    const crit = i.quantity<=i.minQuantity;
    return `<tr class="hover:bg-stone-50/50 text-xs border-b border-stone-100">
      <td class="px-4 py-3 font-bold text-stone-800">${i.name}</td>
      <td class="px-4 py-3 text-stone-600">${i.category}</td>
      <td class="px-4 py-3 text-stone-500">${i.location}</td>
      <td class="px-4 py-3"><span class="inline-flex px-2 py-1 rounded-xl text-xs font-bold ${crit?'bg-red-50 text-red-800 animate-pulse border border-red-100':'bg-stone-100 text-stone-700'}">${i.quantity} un</span></td>
      <td class="px-4 py-3 text-stone-400 max-w-xs truncate">${i.notes||'—'}</td>
      <td class="px-4 py-3 text-right">${hw?`<div class="flex items-center justify-end gap-1">
        <button onclick="adjQty('${i.id}',-1,${i.quantity},${i.minQuantity},'${(i.name||'').replace(/'/g,'')}')" class="px-2 py-1 bg-stone-100 hover:bg-stone-200 rounded-lg font-bold text-xs">−</button>
        <button onclick="adjQty('${i.id}',1,${i.quantity},${i.minQuantity},'${(i.name||'').replace(/'/g,'')}')" class="px-2 py-1 bg-stone-100 hover:bg-stone-200 rounded-lg font-bold text-xs">+</button>
        <button onclick="fsDel('stock','${i.id}').then(()=>notif('Removido','','warning'))" class="ml-1 text-xs text-stone-400 hover:text-red-650">Excluir</button>
      </div>`:''}</td>
    </tr>`;
  }).join('') : `<tr><td colspan="6" class="py-8 text-center text-stone-400 text-xs">Nenhum item encontrado.</td></tr>`;

  ws.innerHTML = `
    <div class="mb-6 flex flex-col md:flex-row justify-between items-start gap-2">
      <div><h1 class="font-cinzel text-2xl font-bold text-stone-900">Almoxarifado</h1><p class="text-xs text-stone-500">Materiais e insumos litúrgicos</p></div>
      ${hw?`<div class="flex gap-2">
        <button onclick="openManageCatsModal()" class="px-3 py-2 border border-stone-300 text-stone-700 text-xs font-bold rounded-xl hover:bg-stone-100 uppercase sm-t">Gerenciar Categorias</button>
        <button onclick="openStockModal()" class="px-4 py-2 bg-stone-900 text-white text-xs font-bold rounded-xl uppercase shadow sm-t">Novo Insumo</button>
      </div>`:''}
    </div>
    <div class="bg-white p-5 rounded-2xl border border-stone-200 shadow-sm space-y-4">
      <div class="relative max-w-md">
        <input type="text" value="${stSrch}" oninput="stSrch=this.value;render()" class="w-full pl-9 pr-4 py-2 bg-stone-50 border border-stone-200 rounded-xl text-xs focus:outline-none" placeholder="Buscar insumo ou categoria...">
        <span class="absolute left-3 top-2.5 text-stone-400 text-xs">🔍</span>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead><tr class="bg-stone-50 text-[10px] font-bold uppercase tracking-wider text-stone-400 border-b border-stone-200">
            <th class="px-4 py-3">Insumo</th><th class="px-4 py-3">Categoria</th><th class="px-4 py-3">Localização</th><th class="px-4 py-3">Qtd</th><th class="px-4 py-3">Obs</th><th class="px-4 py-3"></th>
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </div>`;
}

async function adjQty(id,delta,cur,min,name){
  const nq = Math.max(0,cur+delta);
  await fsUpd('stock',id,{quantity:nq});
  if(nq<=min) notif('Estoque Baixo',`${name} atingiu o mínimo.`,'warning');
  await addLog(`Ajustou estoque: ${name} → ${nq}`);
}

function openStockModal(){
  const cats = S.stockCats.map(c=>c.name||c).filter(Boolean);
  openModal('Novo Insumo',`<form onsubmit="handleStock(event)" class="space-y-4 text-xs">
    <div><label class="block font-bold text-stone-500 uppercase mb-1">Nome</label><input type="text" id="s-n" required class="w-full p-2.5 bg-stone-50 border border-stone-200 rounded-xl focus:outline-none"></div>
    <div class="grid grid-cols-2 gap-4">
      <div><label class="block font-bold text-stone-500 uppercase mb-1">Categoria</label>
        <div class="flex gap-2"><select id="s-c" class="flex-1 p-2.5 bg-stone-50 border border-stone-200 rounded-xl focus:outline-none">${cats.map(c=>`<option>${c}</option>`).join('')}</select>
        <button type="button" onclick="openCatModal()" class="px-3 bg-stone-100 hover:bg-stone-200 rounded-xl font-bold">+ Nova</button></div>
      </div>
      <div><label class="block font-bold text-stone-500 uppercase mb-1">Localização</label><input type="text" id="s-l" required class="w-full p-2.5 bg-stone-50 border border-stone-200 rounded-xl focus:outline-none"></div>
    </div>

async function handleCreateCategory(e) {
  e.preventDefault();
  const val = $('new-cat-input').value.trim();
  if (!val) return;
  const exists = S.stockCats.some(c => c.name.toLowerCase() === val.toLowerCase());
  if (exists) {
    notif('Erro', 'Esta categoria já existe.', 'error');
    return;
  }
  await fsAdd('stockCategories', { name: val });
  notif('Sucesso', `Categoria "${val}" criada.`, 'success');
  await addLog(`Criou categoria de estoque: ${val}`);
  openManageCatsModal();
}

function editCategoryName(id, oldName) {
  const newName = window.prompt(`Editar o nome da categoria "${oldName}":`, oldName);
  if (newName && newName.trim() && newName.trim() !== oldName) {
    const sanitized = newName.trim();
    fsUpd('stockCategories', id, { name: sanitized })
      .then(async () => {
        const batch = FB().writeBatch(db());
        let count = 0;
        S.stock.forEach(item => {
          if (item.category === oldName) {
            batch.update(FB().doc(db(), 'stock', item.id), { category: sanitized });
            count++;
          }
        });
        if (count > 0) await batch.commit();
        notif('Sucesso', 'Categoria e insumos atualizados.', 'success');
        await addLog(`Editou categoria: ${oldName} → ${sanitized}`);
        openManageCatsModal();
      })
      .catch(err => notif('Erro', err.message, 'error'));
  }
}

function deleteCategory(id, name) {
  const isUsed = S.stock.some(item => item.category === name);
  if (isUsed) {
    if (!confirm(`A categoria "${name}" possui insumos vinculados. Se excluir, esses itens ficarão sem categoria definida. Confirmar exclusão?`)) return;
  }
  fsDel('stockCategories', id)
    .then(async () => {
      notif('Removido', `Categoria "${name}" excluída.`, 'warning');
      await addLog(`Excluiu categoria de estoque: ${name}`);
      openManageCatsModal();
    })
    .catch(err => notif('Erro', err.message, 'error'));
}

async function adjCbQty(id, delta, cur, min, name) {
  const nq = Math.max(0, cur + delta);
  await fsUpd('cambonagem', id, { quantity: nq });
  if (nq <= min && min > 0) {
    notif('Estoque Baixo', `${name} atingiu a quantidade crítica.`, 'warning');
  } else {
    notif('Ajuste de Cambonagem', `${name}: ${cur} → ${nq}`, 'success');
  }
  await addLog(`Cambonagem: ${name} (qtd ${cur} → ${nq})`);
}

async function handleCambonagem(e, editId) {
  e.preventDefault();
  const data = {
    name: $('cb-n').value.trim(),
    serialNumber: $('cb-sn').value.trim().toUpperCase(),
    category: $('cb-c').value,
    location: $('cb-l').value.trim(),
    quantity: parseInt($('cb-q').value) || 0,
    minQuantity: parseInt($('cb-m').value) || 0,
    imageUrl: $('cb-img').value.trim(),
    notes: $('cb-o').value.trim()
  };

  if (editId) {
    await fsUpd('cambonagem', editId, data);
    notif('Atualizado', 'Utensílio alterado com sucesso.', 'success');
  } else {
    await fsAdd('cambonagem', data);
    notif('Cadastrado', 'Novo utensílio adicionado!', 'success');
  }
  await addLog(`Salvou utensílio de cambonagem: ${data.name}`);
  closeModal();
}

function openCbCameraScannerModal() {
  openModal('Leitor de Código via Câmera', `
    <div class="space-y-4 text-xs text-center">
      <p class="text-stone-500">Aponte a câmera do seu celular para o QR Code ou código impresso do produto.</p>
      
      <div id="reader-container" class="relative overflow-hidden rounded-2xl border-2 border-amber-500 bg-stone-900 min-h-[250px] flex items-center justify-center">
        <div id="reader" class="w-full"></div>
      </div>

      <div id="scan-result-card" class="hidden p-4 bg-emerald-50 border border-emerald-200 rounded-2xl text-left space-y-2">
        <span class="block text-[10px] font-bold text-emerald-800 uppercase">Item Encontrado!</span>
        <h4 id="scanned-name" class="font-bold text-stone-900 text-sm">—</h4>
        <p class="text-stone-600">Código: <span id="scanned-code" class="font-mono font-bold"></span></p>
        <div class="flex items-center gap-3 pt-2">
          <button id="btn-scanned-dec" class="flex-1 py-2 bg-stone-200 hover:bg-stone-300 font-bold rounded-xl text-stone-800 text-xs">− Dar Baixa (-1)</button>
          <button id="btn-scanned-inc" class="flex-1 py-2 bg-amber-500 hover:bg-amber-600 font-bold rounded-xl text-stone-950 text-xs">+ Entrar (+1)</button>
        </div>
      </div>

      <div class="pt-2">
        <button type="button" onclick="closeModal()" class="px-4 py-2 bg-stone-100 text-stone-600 rounded-xl font-bold">Fechar Câmera</button>
      </div>
    </div>
  `);

  setTimeout(() => {
    try {
      if (typeof Html5Qrcode !== 'undefined') {
        const html5QrCode = new Html5Qrcode("reader");
        window._qrScannerInstance = html5QrCode;

        html5QrCode.start(
          { facingMode: "environment" },
          { fps: 10, qrbox: { width: 220, height: 220 } },
          (decodedText) => {
            const code = decodedText.trim().toUpperCase();
            const found = S.cambonagem.find(i => (i.serialNumber || '').toUpperCase() === code || i.id === code);
            
            if (found) {
              $('scan-result-card')?.classList.remove('hidden');
              $('scanned-name').innerText = found.name;
              $('scanned-code').innerText = code;

              $('btn-scanned-dec').onclick = () => {
                adjCbQty(found.id, -1, found.quantity || 0, found.minQuantity || 0, found.name);
                closeModal();
              };
              $('btn-scanned-inc').onclick = () => {
                adjCbQty(found.id, 1, found.quantity || 0, found.minQuantity || 0, found.name);
                closeModal();
              };
            } else {
              notif('Código lido', `Nenhum item com código "${code}". Aplicando filtro de busca...`, 'info');
              cbSrch = code;
              closeModal();
              render();
            }
          },
          () => {}
        ).catch(err => {
          $('reader-container').innerHTML = `<p class="p-6 text-stone-400">Não foi possível acessar a câmera do dispositivo.<br><span class="text-[10px]">${err.message||''}</span></p>`;
        });
      } else {
        $('reader-container').innerHTML = `<p class="p-6 text-stone-400">Biblioteca leitora de câmera carregando...</p>`;
      }
    } catch(err) {
      console.warn("Erro ao abrir câmera:", err);
    }
  }, 300);
}

  const list = S.cambonagemCats.map(c => `

        <button onclick="deleteCbCategory('${c.id}', '${(c.name || '').replace(/'/g,"\\'")}')" class="px-2.5 py-1 bg-red-50 hover:bg-red-100 text-red-600 font-bold rounded-lg text-[10px] sm-t">Excluir</button>

      </form>

async function handleCreateCbCategory(e) {
  e.preventDefault();
  const val = $('new-cb-cat-input').value.trim();
  if (!val) return;
  await fsAdd('cambonagemCategories', { name: val });
  notif('Sucesso', `Categoria "${val}" criada.`, 'success');
  openManageCbCatsModal();
}

function editCbCategoryName(id, oldName) {
  const newName = window.prompt(`Editar o nome da categoria "${oldName}":`, oldName);
  if (newName && newName.trim() && newName.trim() !== oldName) {
    const sanitized = newName.trim();
    fsUpd('cambonagemCategories', id, { name: sanitized }).then(async () => {
      const batch = FB().writeBatch(db());
      let count = 0;
      S.cambonagem.forEach(item => {
        if (item.category === oldName) {
          batch.update(FB().doc(db(), 'cambonagem', item.id), { category: sanitized });
          count++;
        }
      });
      if (count > 0) await batch.commit();
      notif('Sucesso', 'Categoria atualizada!', 'success');
      openManageCbCatsModal();
    });
  }
}

function deleteCbCategory(id, name) {
  if (!confirm(`Excluir a categoria "${name}"?`)) return;
  fsDel('cambonagemCategories', id).then(() => {
    notif('Removida', `Categoria "${name}" excluída.`, 'warning');
    openManageCbCatsModal();
  });
}

function rMediuns(ws,hw){

  const u=S.users.find(x=>x.id===uid); if(!u) return; const c=u.crown||{};

async function handleCrown(e,uid){
  e.preventDefault();
  const crown={orixaFrente:$('cf').value.trim(),orixaJunto:$('cj').value.trim(),exu:$('ce').value.trim(),pombagira:$('cp').value.trim(),caboclo:$('cc').value.trim(),boiadeiro:$('cb').value.trim(),ere:$('cr').value.trim(),pretoVelho:$('cv').value.trim()};
  const bday=$('cbd').value;
  await fsUpd('users',uid,{crown,birthday:bday});
  if(S.me.id===uid){S.me.crown=crown;S.me.birthday=bday;}
  await addLog('Atualizou ficha de médium');
  closeModal(); notif('Ficha atualizada','','success');
}

async function setPresenca(sid, uid, presente) {
  const ex = S.presencas.find(p=>p.scheduleId===sid&&p.userId===uid);
  if (ex) await fsUpd('presencas', ex.id, {presente});
  else    await fsAdd('presencas', {scheduleId:sid, userId:uid, presente});
}
async function clearPres(sid, uid) {
  const ex = S.presencas.find(p=>p.scheduleId===sid&&p.userId===uid);
  if (ex) await fsDel('presencas', ex.id);
}
async function marcarTodos(sid) {
  const batch = FB().writeBatch(db());
  S.users.forEach(u=>{
    const ex = S.presencas.find(p=>p.scheduleId===sid&&p.userId===u.id);
    if (ex) batch.update(FB().doc(db(),'presencas',ex.id), {presente:true, _ts:ts()});
    else    batch.set(FB().doc(db(),'presencas',`pr_${sid}_${u.id}`), {scheduleId:sid, userId:u.id, presente:true, _ts:ts()});
  });
  await batch.commit();
  notif('Todos marcados como presentes!','','success');
}

          <form onsubmit="handleCfg(event)" class="space-y-4 text-xs">
            <div><label class="block font-bold text-stone-500 uppercase mb-1">Nome Oficial</label>
              <input type="text" id="cfg-n" value="${S.cfg.terreiroName||''}" required class="w-full p-2.5 bg-stone-50 border border-stone-200 rounded-xl focus:outline-none"></div>
            <div><label class="block font-bold text-stone-500 uppercase mb-1">Subtítulo</label>
              <input type="text" id="cfg-s" value="${S.cfg.subtitle||''}" required class="w-full p-2.5 bg-stone-50 border border-stone-200 rounded-xl focus:outline-none"></div>
            <div><label class="block font-bold text-stone-500 uppercase mb-1">Chave PIX</label>
              <input type="text" id="cfg-p" value="${S.cfg.pixKey||''}" class="w-full p-2.5 bg-stone-50 border border-stone-200 rounded-xl focus:outline-none"></div>
            <div><label class="block font-bold text-stone-500 uppercase mb-1">URL da Logo</label>
              <input type="url" id="cfg-l" value="${S.cfg.logoUrl||''}" class="w-full p-2.5 bg-stone-50 border border-stone-200 rounded-xl focus:outline-none" placeholder="https://..."></div>
            <button type="submit" class="w-full py-2 bg-stone-900 hover:bg-stone-800 text-white font-bold rounded-xl uppercase sm-t">Salvar Configurações</button>
          </form>
        </div>

        ${canEdit?`<div class="bg-white p-5 rounded-2xl border border-stone-200 shadow-sm">
          <h3 class="font-cinzel text-sm font-bold text-stone-900 border-b border-stone-100 pb-3 mb-3">Cadastrar Médium</h3>
          <p class="text-xs text-stone-500 mb-4 leading-relaxed">
            Preencha os dados abaixo para gerar diretamente as credenciais de e-mail/senha e criar o perfil do médium no terreiro.
          </p>
          <button onclick="openCreateProfile()" class="w-full py-2.5 bg-amber-500 hover:bg-amber-600 text-stone-950 font-bold rounded-xl text-xs uppercase sm-t">Criar Perfil de Médium</button>
        </div>`:''}
      </div>

      <div class="lg:col-span-2 bg-white p-5 rounded-2xl border border-stone-200 shadow-sm">
        <h3 class="font-cinzel text-sm font-bold text-stone-900 border-b border-stone-100 pb-4 mb-4">Médiuns Cadastrados</h3>
        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse">
            <thead><tr class="bg-stone-50 text-[10px] font-bold uppercase tracking-wider text-stone-400 border-b border-stone-200">
              <th class="px-4 py-3">Nome</th><th class="px-4 py-3">E-mail</th>
              <th class="px-4 py-3">Cargo</th><th class="px-4 py-3">Status</th><th class="px-4 py-3"></th>
            </tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      </div>
    </div>`;
}

async function handleCfg(e) {
  e.preventDefault();
  await fsSet('config','main',{
    terreiroName: $('cfg-n').value.trim(),
    subtitle:      $('cfg-s').value.trim(),
    pixKey:        $('cfg-p').value.trim(),
    logoUrl:       $('cfg-l').value.trim()
  });
  await addLog('Atualizou configurações do terreiro');
  notif('Configurações salvas!','','success');
}

function openPermModal(uid) {
  const u = S.users.find(x=>x.id===uid); if (!u) return;
  const checks = Object.keys(TABS).map(t=>`
    <label class="flex items-center gap-2 p-1.5 bg-stone-50 rounded-xl hover:bg-stone-100 cursor-pointer">
      <input type="checkbox" name="pt" value="${t}" ${(u.allowedTabs||[]).includes(t)?'checked':''} class="w-3.5 h-3.5 accent-amber-600">
      <span class="text-[10px] font-medium">${TABS[t].label}</span>
    </label>`).join('');
  openModal(`Permissões: ${u.name}`,`
    <form onsubmit="handlePerm(event,'${uid}')" class="space-y-4 text-xs">
      <div><label class="block font-bold text-stone-500 uppercase mb-1">Cargo</label>
        <select id="pm-c" class="w-full p-2.5 bg-stone-50 border border-stone-200 rounded-xl focus:outline-none">
          ${CARGOS.map(c=>`<option ${u.cargo===c?'selected':''}>${c}</option>`).join('')}
        </select>
      </div>
      <div><label class="block font-bold text-stone-500 uppercase mb-2">Módulos Liberados</label>
        <div class="grid grid-cols-2 gap-1 max-h-52 overflow-y-auto">${checks}</div>
      </div>
      <div class="pt-4 flex justify-end gap-2 border-t border-stone-100">
        <button type="button" onclick="closeModal()" class="px-4 py-2 bg-stone-100 text-stone-600 rounded-xl font-bold">Cancelar</button>
        <button type="submit" class="px-4 py-2 bg-stone-900 text-white rounded-xl font-bold">Salvar</button>
      </div>
    </form>`);
}

async function handlePerm(e, uid) {
  e.preventDefault();
  const cargo = $('pm-c').value;
  const tabs  = [...document.getElementsByName('pt')].filter(c=>c.checked).map(c=>c.value);
  await fsUpd('users', uid, {cargo, allowedTabs:tabs});
  await addLog('Atualizou permissões de médium');
  closeModal(); notif('Permissões atualizadas!','','success');
}

function openAdminReset(email) {
  if (!email) { notif('Erro','Este médium não tem e-mail cadastrado.','error'); return; }
  openModal('Resetar Senha',`
    <div class="space-y-4 text-xs">
      <div class="p-3 bg-amber-50 border border-amber-200 rounded-xl text-amber-800 leading-relaxed">
        Um link de redefinição será enviado para <strong>${email}</strong>.<br>
        O médium poderá criar uma nova senha pelo link recebido.
      </div>
      <div class="pt-4 flex justify-end gap-2">
        <button onclick="closeModal()" class="px-4 py-2 bg-stone-100 text-stone-600 rounded-xl font-bold">Cancelar</button>
        <button onclick="sendReset('${email}')" class="px-4 py-2 bg-stone-900 text-white rounded-xl font-bold">Enviar Link</button>
      </div>
    </div>`);
}

async function sendReset(email) {
  try {
    await FB().sendPasswordResetEmail(au(), email);
    closeModal();
    notif('E-mail enviado!',`Link enviado para ${email}`,'success');
    await addLog(`Enviou reset de senha para ${email}`);
  } catch(err) { notif('Erro',err.message,'error'); }
}

function openCreateProfile() {
  const checks = Object.keys(TABS).map(t=>`
    <label class="flex items-center gap-2 p-1.5 bg-stone-50 rounded-xl hover:bg-stone-100 cursor-pointer">
      <input type="checkbox" name="np" value="${t}" class="w-3.5 h-3.5 accent-amber-600">
      <span class="text-[10px] font-medium">${TABS[t].label}</span>
    </label>`).join('');
  openModal('Criar Perfil de Médium',`
    <form onsubmit="handleCreateProfile(event)" id="create-profile-form" class="space-y-4 text-xs">
      <div class="grid grid-cols-2 gap-3">
        <div><label class="block font-bold text-stone-500 uppercase mb-1">Nome Completo</label>
          <input type="text" id="np-name" required class="w-full p-2.5 bg-stone-50 border border-stone-200 rounded-xl focus:outline-none"></div>
        <div><label class="block font-bold text-stone-500 uppercase mb-1">E-mail de Acesso</label>
          <input type="email" id="np-email" required placeholder="medium@exemplo.com" class="w-full p-2.5 bg-stone-50 border border-stone-200 rounded-xl focus:outline-none"></div>
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div><label class="block font-bold text-stone-500 uppercase mb-1">Senha de Entrada</label>
          <input type="password" id="np-pass" required minlength="6" placeholder="Mínimo 6 caracteres" class="w-full p-2.5 bg-stone-50 border border-stone-200 rounded-xl focus:outline-none"></div>
        <div><label class="block font-bold text-stone-500 uppercase mb-1">Cargo</label>
          <select id="np-cargo" class="w-full p-2.5 bg-stone-50 border border-stone-200 rounded-xl focus:outline-none">
            ${CARGOS.map(c=>`<option>${c}</option>`).join('')}
          </select>
        </div>
      </div>
      <div><label class="block font-bold text-stone-500 uppercase mb-2">Módulos Liberados</label>
        <div class="grid grid-cols-2 gap-1 max-h-40 overflow-y-auto">${checks}</div>
      </div>
      <div class="pt-4 flex justify-end gap-2 border-t border-stone-100">
        <button type="button" onclick="closeModal()" class="px-4 py-2 bg-stone-100 text-stone-600 rounded-xl font-bold">Cancelar</button>
        <button type="submit" id="btn-create-profile" class="px-4 py-2 bg-stone-900 text-white rounded-xl font-bold sm-t">Criar Membro no Sistema</button>
      </div>
    </form>`);
}

async function handleCreateProfile(e) {
  e.preventDefault();
  const name  = $('np-name').value.trim();
  const email = $('np-email').value.trim();
  const pass  = $('np-pass').value;
  const cargo = $('np-cargo').value;
  const tabs  = [...document.getElementsByName('np')].filter(c=>c.checked).map(c=>c.value);
  const btn   = $('btn-create-profile');

  if (!name || !email || !pass) {
    notif('Erro', 'Preencha todos os campos obrigatórios.', 'error');
    return;
  }

  btn.disabled = true;
  btn.innerHTML = `<svg class="spin w-4 h-4 text-white inline mr-1" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg> Gerando acesso...`;

  let secApp;
  try {
    secApp = FB().initializeApp(FB().firebaseConfig, "SecApp_" + Date.now());
    const secAuth = FB().getAuth(secApp);
    const userCred = await FB().createUserWithEmailAndPassword(secAuth, email, pass);
    const uid = userCred.user.uid;

    await fsSet('users', uid, {
      name, email, cargo, allowedTabs: tabs, crown: {}, duesStatus: 'Em Dia', duesItems: [], birthday: ''
    });

    await addLog(`Criou perfil de médium diretamente: ${name} (${email})`);
    await FB().signOut(secAuth);
    closeModal();
    notif('Membro Criado!', 'Usuário e perfil gerados com sucesso.', 'success');
  } catch (err) {
    let errMsg = err.message;
    if (err.code === 'auth/email-already-in-use') errMsg = 'Este e-mail já está sendo utilizado por outro médium.';
    else if (err.code === 'auth/weak-password') errMsg = 'A senha escolhida é muito fraca (mínimo de 6 caracteres).';
    notif('Erro no Cadastro', errMsg, 'error');
    btn.disabled = false;
    btn.innerHTML = 'Criar Membro no Sistema';
  } finally {
    if (secApp) {
      try { await FB().deleteApp(secApp); } catch (_) {}
    }
  }
}

// BACKUP JSON
function exportBackup() {
  const data = {
    version: 5, exportedAt: new Date().toISOString(),
    terreiro: S.cfg.terreiroName,
    users: S.users, stock: S.stock, cambonagem: S.cambonagem,
    schedule: S.schedule, notices: S.notices, presencas: S.presencas,
    foods: S.foods, freezers: S.freezers, caixotes: S.caixotes, fabrics: S.fabrics,
    transactions: S.transactions, config: S.cfg
  };
  const blob = new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `backup-paijose-${new Date().toISOString().split('T')[0]}.json`;
  a.click();
  notif('Backup exportado!','Arquivo JSON salvo com sucesso.','success');
}
</script>
